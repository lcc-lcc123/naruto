<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>映射 + AI 世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d14;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:auto}
#topbar a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:9px;backdrop-filter:blur(6px)}
#topbar .tt{flex:1;text-align:center;font-size:15px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#topbar .tb{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:13px;padding:7px 11px;border-radius:9px;backdrop-filter:blur(6px)}
#topbar .tb.on{background:#07c160}
#hint{position:absolute;left:10px;top:calc(58px + env(safe-area-inset-top));font-size:11px;line-height:1.7;color:#d7e3f7;background:rgba(0,0,0,.4);padding:8px 10px;border-radius:10px;max-width:62vw;backdrop-filter:blur(4px)}
#hint b{color:#8fe2b3}
#cross{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px}
#cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 3px rgba(0,0,0,.7)}
#cross:before{left:7px;top:0;width:2px;height:16px}
#cross:after{top:7px;left:0;height:2px;width:16px}
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
#acts{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,54px);gap:8px;pointer-events:auto}
#acts button{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:600;backdrop-filter:blur(6px);touch-action:none}
#acts button:active{background:rgba(255,255,255,.35)}
#acts button.dig{background:rgba(226,86,66,.55)}
#acts button.put{background:rgba(7,193,96,.5)}
#acts button.jump{background:rgba(90,141,239,.55)}
#hotbar{position:absolute;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:5px;background:rgba(0,0,0,.38);border-radius:12px;pointer-events:auto;backdrop-filter:blur(6px);max-width:94vw;overflow-x:auto}
#hotbar .slot{width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0}
#hotbar .slot.on{border-color:#fff;box-shadow:0 0 0 2px rgba(7,193,96,.7)}
#hotbar .sw{width:19px;height:19px;border-radius:4px;margin-bottom:2px}
#info{position:absolute;left:10px;bottom:calc(214px + env(safe-area-inset-bottom));font-size:11px;line-height:1.6;color:#dbe7fa;background:rgba(0,0,0,.42);padding:7px 9px;border-radius:9px;max-width:60vw;backdrop-filter:blur(4px);pointer-events:none}
#atomPanel{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));width:min(68vw,300px);background:rgba(10,16,26,.86);border:1px solid rgba(120,170,255,.35);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.75;color:#cfe0ff;pointer-events:auto;backdrop-filter:blur(8px)}
#atomPanel h3{font-size:13px;color:#8fe2b3;margin-bottom:4px}
#atomPanel .el{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#aiPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(92vw,420px);max-height:56vh;background:rgba(12,18,28,.94);border:1px solid rgba(120,170,255,.3);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;z-index:20}
#aiPanel .ah{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600}
#aiPanel .ah button{margin-left:auto;background:none;border:none;color:#9fb3d8;font-size:18px}
#aiPanel .log{flex:1;overflow-y:auto;padding:10px 12px;font-size:12px;line-height:1.7;color:#c6d6ee;min-height:80px}
#aiPanel .log .me{color:#8fe2b3;margin-top:6px}
#aiPanel .cmds{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.1)}
#aiPanel .cmds button{background:rgba(90,141,239,.22);border:1px solid rgba(120,170,255,.35);color:#dbe7fa;border-radius:999px;padding:7px 11px;font-size:12px}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 14px;border-radius:10px;font-size:12px;color:#fff;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center;line-height:1.6}
.hidden{display:none!important}

/* ---------- 化学映射面板 ---------- */
#chem{position:fixed;inset:0;z-index:60;background:rgba(7,11,17,.95);backdrop-filter:blur(16px);display:flex;flex-direction:column;color:#dce7f7}
.chead{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.chead .cback{background:none;border:none;color:#dce7f7;font-size:26px;width:34px;line-height:1;padding:0}
.chead .ctitle{font-size:15px;font-weight:600;flex:1}
.chead .csub{font-size:10px;color:#7e8ea6}
.ctabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.ctabs button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#b9c8dd;border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.ctabs button.on{background:#dce7f7;color:#0a1018;border-color:#dce7f7;font-weight:600}
.cbody{flex:1;min-height:0;overflow-y:auto;padding:2px 12px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.cpanel{display:block}
.ptableWrap{padding:2px 0 6px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;width:100%;max-width:760px;margin:0 auto;padding:3px 1px}
.ecell{position:relative;aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:6.5px;line-height:1.05;color:#fff;cursor:pointer;opacity:.94;font-family:Inter,system-ui,sans-serif}
.ecell b{font-size:8px;letter-spacing:0}
.ecell.empty{visibility:hidden}
.ecell:active{transform:scale(.93)}
.ecell.sel{outline:2px solid #fff;outline-offset:1px}
.cat-非金属{background:#2d5f9e}.cat-碱金属{background:#a84a32}.cat-碱土金属{background:#a8792b}
.cat-过渡金属{background:#5b4fa3}.cat-后过渡{background:#4f6274}.cat-类金属{background:#2f7d6c}
.cat-卤素{background:#9c3f60}.cat-稀有气体{background:#6a5a9e}.cat-镧系{background:#2f7a55}
.cat-锕系{background:#8a7431}.cat-未知{background:#4a5260}
.detail{margin-top:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.8;color:#c3d3e8}
.detail h3{font-size:15px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail .badge{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:400}
.detail .kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(255,255,255,.08);padding:4px 0}
.detail .kv span:last-child{color:#eaf2ff;text-align:right}
.detail .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 2px}
.detail .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5fd0a0,#8fd6ff)}
.detail .mut{color:#8ea1ba}\n.detail .el{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}\n.mbtn{cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.mcard{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);cursor:pointer}
.mcard .sw{width:26px;height:26px;border-radius:6px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.mcard .mn{font-size:12px;color:#e8f1ff}
.mcard .mf{font-size:10px;color:#8ea1ba;margin-top:1px}
.mcard.sel{outline:1px solid #dce7f7}
.rrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.rrow select{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#eaf2ff;border-radius:9px;padding:9px 10px;font-size:13px;outline:none}
.rrow .swap{width:42px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dce7f7;font-size:16px;flex-shrink:0}
.rrow .run{flex:1;height:40px;border:none;border-radius:9px;background:#dce7f7;color:#0a1018;font-weight:600;font-size:14px}
.rrow .run:active{opacity:.85}
.catline{font-size:11px;color:#7e8ea6;margin:14px 0 6px;letter-spacing:.06em}
.abund .arow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:11px;color:#b9c8dd}
.abund .arow .sym{width:26px;color:#eaf2ff;font-weight:600}
.abund .arow .ab{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.abund .arow .ab i{display:block;height:100%;background:linear-gradient(90deg,#4f8fd6,#8fd6ff);border-radius:4px}
.abund .arow .pc{width:58px;text-align:right;color:#8ea1ba}
.dep{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:12px;color:#c3d3e8}
.dep b{color:#fff;font-weight:500}
@media (max-width:760px){
  .ptable{gap:2px}
  .mgrid{grid-template-columns:1fr 1fr}
}

@media (max-width:760px){
  #hint{max-width:58vw;font-size:10px}
  #acts{grid-template-columns:repeat(3,50px);gap:6px}
  #acts button{width:50px;height:50px;font-size:12px}
  #joy{width:104px;height:104px}
  #hotbar{bottom:calc(148px + env(safe-area-inset-bottom))}
  #hotbar .slot{width:37px;height:37px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="topbar">
    <a href="/">‹ 首页</a>
    <div class="tt">映射 + AI 世界</div>
    <button class="tb" id="btnChem">化学</button>
    <button class="tb" id="btnAI">AI</button>
  </div>
  <div id="hint">拖动画面看向四周 · 左下摇杆移动<br>对准方块点 <b>挖</b> / <b>放</b> · 点右上 <b>化学</b> 查元素与反应</div>
  <div id="cross"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="acts">
    <button class="jump" data-act="jump">跳</button>
    <button class="dig" data-act="dig">挖</button>
    <button class="put" data-act="put">放</button>
    <button data-act="inspect">看</button>
    <button id="btnAtom" type="button">原子</button>
    <button id="btnView" type="button">视角</button>
  </div>
  <div id="info">--</div>
  <div id="hotbar"></div>
  <div id="atomPanel" class="hidden"></div>
  <div id="aiPanel" class="hidden">
    <div class="ah"><span>AI 世界助手</span><button id="aiClose" type="button">×</button></div>
    <div class="log" id="aiLog"><div>我是本地 AI 助手（无联网）：可以生成建筑、种树、切换昼夜，也能解释任何方块的原子构成。</div></div>
    <div class="cmds">
      <button data-cmd="house">建一座小屋</button>
      <button data-cmd="tree">种一棵树</button>
      <button data-cmd="day">切换昼夜</button>
      <button data-cmd="walk">带我回到出生点</button>
      <button data-cmd="what">脚下是什么</button>
      <button data-cmd="flat">平整前方地面</button>
    </div>
  </div>
  <div id="chem" class="hidden">
    <div class="chead">
      <button class="cback" id="chemBack" type="button">‹</button>
      <div class="ctitle">化学映射</div>
      <div class="csub">118 元素 · 物质 · 反应</div>
    </div>
    <div class="ctabs">
      <button data-ctab="table" class="on" type="button">元素周期表</button>
      <button data-ctab="mats" type="button">物质库</button>
      <button data-ctab="react" type="button">反应台</button>
      <button data-ctab="dist" type="button">元素分布</button>
    </div>
    <div class="cbody">
      <div id="cpanel-table" class="cpanel">
        <div class="ptableWrap"><div class="ptable" id="ptable"></div></div>
        <div class="detail" id="elDetail">点击任意元素，查看原子量、熔沸点、密度、电负性、地壳丰度与主要存在形式。</div>
      </div>
      <div id="cpanel-mats" class="cpanel hidden">
        <div class="mgrid" id="matList"></div>
        <div class="detail" id="matDetail">选择一种物质，查看它的元素组成、物理性质、微观结构，以及它能参与的反应。</div>
      </div>
      <div id="cpanel-react" class="cpanel hidden">
        <div class="rrow"><select id="rA"></select><button class="swap" id="rSwap" type="button">⇄</button><select id="rB"></select></div>
        <div class="rrow">
          <select id="rCond"><option>常温</option><option>加热</option><option>点燃</option><option>通电</option><option>催化剂</option></select>
          <select id="rAmt"><option>适量</option><option>少量</option><option>过量</option></select>
        </div>
        <div class="rrow"><button class="run" id="rRun" type="button">进行反应</button></div>
        <div class="detail" id="rOut">选择两种物质、条件与用量，查看产物。现实反应还受浓度、压强、催化剂与加入顺序影响。</div>
      </div>
      <div id="cpanel-dist" class="cpanel hidden">
        <div class="catline">地壳元素丰度（质量 ppm）</div>
        <div class="abund" id="abund"></div>
        <div class="catline">当前世界中的矿物分布（生成规则）</div>
        <div id="dist"></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script>
(function(){

var WX=64,WZ=64,WY=28,SEA=8;
var canvas=document.getElementById('gl');
var gl=canvas.getContext('webgl',{antialias:true,alpha:false});

/* ---------- 方块定义 ---------- */

function setB(x,y,z,t){if(x<0||x>=WX||y<0||y>=WY||z<0||z>=WZ)return;blocks[x+WX*(z+WZ*y)]=t;}
function hash2(x,z){var n=Math.imul(x,374761393)+Math.imul(z,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
function noise2(x,z){
  var xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;

function genWorld(){
  blocks.fill(0);
  for(var x=0;x<WX;x++)for(var z=0;z<WZ;z++){
    var h=heightAt(x,z);
    var top=h>=SEA?1:4;
    for(var y=0;y<=h;y++){
      var t=y===h?top:(y>h-3?2:3);
      if(h<SEA&&y>=h)t=4;
      setB(x,y,z,t);
    }
    if(h<SEA)for(var w=h+1;w<=SEA;w++)setB(x,w,z,5);
  }
  // 树
  for(var x2=3;x2<WX-3;x2++)for(var z2=3;z2<WZ-3;z2++){
    if(hash2(x2+101,z2+57)<0.994)continue;
    if(Math.abs(x2-WX/2)<10&&Math.abs(z2-WZ/2)<10)continue;
    var hh=heightAt(x2,z2);
    if(hh<=SEA+1)continue;
    var th=4+Math.floor(hash2(x2,z2)*2);
    for(var y2=1;y2<=th;y2++)setB(x2,hh+y2,z2,6);
    for(var dx=-2;dx<=2;dx++)for(var dz=-2;dz<=2;dz++)for(var dy=-1;dy<=1;dy++){
      if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy)<3)continue;
      if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;
      if(getB(x2+dx,hh+th+dy,z2+dz)===0)setB(x2+dx,hh+th+dy,z2+dz,7);
    }
    setB(x2,hh+th+1,z2,7);
  }
  // ---- 矿脉：按现实成矿深度近似 ----
  for(var ox=2;ox<WX-2;ox++)for(var oz=1;oz<WZ-1;oz++){
    var oh=heightAt(ox,oz);
    // 石灰石：中浅层沉积
    if(hash2(ox+7,oz+91)>0.972&&oh>SEA+1){
      var ly=Math.max(2,oh-4-Math.floor(hash2(ox*3,oz*7)*3));
      for(var dx3=-1;dx3<=1;dx3++)for(var dz3=-1;dz3<=1;dz3++){
        if(getB(ox+dx3,ly,oz+dz3)===3)setB(ox+dx3,ly,oz+dz3,11);
      }
    }
    // 煤：浅中层
    if(hash2(ox+31,oz+17)>0.985&&oh>SEA+3){
      var cy=3+Math.floor(hash2(ox*3,oz*5)*(oh-5));
      for(var dx=0;dx<2;dx++)for(var dz=0;dz<2;dz++)for(var dy=0;dy<2;dy++){
        if(getB(ox+dx,cy+dy,oz+dz)===3)setB(ox+dx,cy+dy,oz+dz,10);
      }
    }
    // 赤铁矿：深层
    if(hash2(ox+101,oz+53)>0.988&&oh>6){
      var fy=2+Math.floor(hash2(ox*7,oz*11)*(oh-6));
      for(var dx2=0;dx2<2;dx2++)for(var dz2=0;dz2<2;dz2++)for(var dy2=0;dy2<2;dy2++){
        if(getB(ox+dx2,fy+dy2,oz+dz2)===3)setB(ox+dx2,fy+dy2,oz+dz2,9);
      }
    }
    // 岩盐：海平面附近、近水
    var nearWater=false;
    for(var wx=-2;wx<=2&&!nearWater;wx++)for(var wz=-2;wz<=2;wz++){
      if(heightAt(ox+wx,oz+wz)<SEA){nearWater=true;break;}
    }
    if(nearWater&&hash2(ox+13,oz+29)>0.972&&oh>SEA){
      var sy2=Math.max(2,SEA-3+Math.floor(hash2(ox*2,oz*3)*3));
      for(var dx4=0;dx4<2;dx4++)for(var dz4=0;dz4<2;dz4++){
        if(getB(ox+dx4,sy2,oz+dz4)===3)setB(ox+dx4,sy2,oz+dz4,12);
      }
    }
  }
}

function mId(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mMul(a,b,o){o=o||new Float32Array(16);for(var i=0;i<4;i++)for(var j=0;j<4;j++){var s=0;for(var k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function mPersp(fov,asp,n,f){var t=1/Math.tan(fov/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;}
function mView(eye,yaw,pitch){
  var cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  var fx=-sy*cp,fy=sp,fz=-cy*cp;
  var rx=cy,ry=0,rz=-sy;
  var ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;
  var m=new Float32Array(16);
  m[0]=rx;m[1]=ux;m[2]=-fx;m[3]=0;
  m[4]=ry;m[5]=uy;m[6]=-fy;m[7]=0;
  m[8]=rz;m[9]=uz;m[10]=-fz;m[11]=0;
  m[12]=-(rx*eye[0]+ry*eye[1]+rz*eye[2]);
  m[13]=-(ux*eye[0]+uy*eye[1]+uz*eye[2]);
  m[14]=(fx*eye[0]+fy*eye[1]+fz*eye[2]);
  m[15]=1;
  return m;
}
function mTRS(px,py,pz,ry,rx,rz,sx,sy,sz){
  var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sxr=Math.sin(rx),cz=Math.cos(rz),szr=Math.sin(rz);
  var m=new Float32Array(16);
  // R = Ry * Rx * Rz (column-major)
  var r00=cy*cz+sy*sxr*szr, r01=-cy*szr+sy*sxr*cz, r02=sy*cx;
  var r10=cx*szr,          r11=cx*cz,           r12=-sxr;
  var r20=-sy*cz+cy*sxr*szr,r21=sy*szr+cy*sxr*cz, r22=cy*cx;
  m[0]=r00*sx;m[1]=r10*sx;m[2]=r20*sx;
  m[4]=r01*sy;m[5]=r11*sy;m[6]=r21*sy;
  m[8]=r02*sz;m[9]=r12*sz;m[10]=r22*sz;
  m[12]=px;m[13]=py;m[14]=pz;m[15]=1;
  return m;
}

function buf(arr){var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);return b;}
function buildMesh(){
  var p=[],c=[],wp=[],wc=[];
  for(var y=0;y<WY;y++)for(var z=0;z<WZ;z++)for(var x=0;x<WX;x++){
    var t=getB(x,y,z);if(!t)continue;
    var def=B[t];
    var isW=t===5;
    for(var fi=0;fi<6;fi++){
      var f=FACES[fi],nx=x+f.n[0],ny=y+f.n[1],nz=z+f.n[2];
      var nb=getB(nx,ny,nz);
      if(isW){if(nb!==0)continue;}
      else{if(nb!==0&&nb!==5)continue;}
      var base;
      if(def.top&&f.n[1]===1)base=def.top;
      else if(def.bot&&f.n[1]===-1)base=def.bot;
      else if(def.side)base=def.side;
      else base=def.col;
      var vv=hash2(x*7+y*13,z*7+y*3),varf=0.93+0.07*vv;
      var cr=base[0]*varf*f.sh,cg=base[1]*varf*f.sh,cb=base[2]*varf*f.sh;
      var arr=isW?wp:p, arrc=isW?wc:c;
      for(var k=0;k<6;k++){
        var vi=(k===0||k===3)?0:(k===1?1:(k===2?2:2));
        var order=[0,1,2,0,2,3];
        vi=order[k];
        var vt=f.v[vi];
        arr.push(x+vt[0],y+vt[1],z+vt[2],f.n[0],f.n[1],f.n[2],cr,cg,cb);
        arrc.push(1);

  if(mesh.nWater)mesh.water=buf(wp);
}

function bakePart(arr,off,px,py,pz,ry,rx,rz,sx,sy,sz,col){
  var m=mTRS(px,py,pz,ry||0,rx||0,rz||0,sx,sy,sz);
  for(var i=0;i<36;i++){

    var nx=cubeVerts[i*6+3],ny=cubeVerts[i*6+4],nz=cubeVerts[i*6+5];
    var wx=m[0]*x+m[4]*y+m[8]*z+m[12];
    var wy=m[1]*x+m[5]*y+m[9]*z+m[13];
    var wz=m[2]*x+m[6]*y+m[10]*z+m[14];
    var sh=0.62+0.38*Math.max(0,ny*0.8+nx*0.25-nz*0.2);
    arr[off++]=wx;arr[off++]=wy;arr[off++]=wz;
    arr[off++]=nx;arr[off++]=ny;arr[off++]=nz;
    arr[off++]=col[0]*sh;arr[off++]=col[1]*sh;arr[off++]=col[2]*sh;

  off=bakePart(charArr,off,x-0.36,y+0.65,z,yaw,0,armA-0.06,0.19,0.12,0.21,skin);

function collides(px,py,pz){
  var x0=Math.floor(px-0.3),x1=Math.floor(px+0.3);
  var y0=Math.floor(py),y1=Math.floor(py+1.78);
  var z0=Math.floor(pz-0.3),z1=Math.floor(pz+0.3);
  for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++)for(var z=z0;z<=z1;z++){
    if(solid(getB(x,y,z)))return true;
  }
  return false;
}
function jump(){if(player.onGround){player.vy=8.2;player.onGround=false;}}
function updatePlayer(dt){
  var fwd=(keys['w']?1:0)-(keys['s']?1:0);
  var str=(keys['d']?1:0)-(keys['a']?1:0);
  fwd+=-joy.y;str+=joy.x;
  var len=Math.hypot(fwd,str);
  if(len>1){fwd/=len;str/=len;}
  var sp=4.8;
  var sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  var mx=(-sy*fwd+cy*str)*sp*dt;
  var mz=(-cy*fwd-sy*str)*sp*dt;
  var nx=player.x+mx;
  if(!collides(nx,player.y,player.z))player.x=nx;
  var nz=player.z+mz;
  if(!collides(player.x,player.y,nz))player.z=nz;
  player.vy-=26*dt;
  var ny=player.y+player.vy*dt;
  if(!collides(player.x,ny,player.z))player.y=ny;
  else{
    if(player.vy<0)player.onGround=true;
    player.vy=0;
  }
  if(player.y<-6){player.x=spawn.x;player.z=spawn.z;player.y=spawn.y;player.vy=0;}
  if(Math.abs(mx)+Math.abs(mz)>0.0005)player.walk=(player.walk||0)+dt*8;
}

/* ---------- 拾取/编辑 ---------- */
function lookVec(){
  var cp=Math.cos(player.pitch),sp=Math.sin(player.pitch);
  return [-Math.sin(player.yaw)*cp,sp,-Math.cos(player.yaw)*cp];
}
function eyePos(){return [player.x,player.y+1.62,player.z];}
function raycast(maxD){
  var e=eyePos(),d=lookVec();
  var step=0.05,last=null;
  for(var t=0;t<maxD;t+=step){
    var x=e[0]+d[0]*t,y=e[1]+d[1]*t,z=e[2]+d[2]*t;
    var bx=Math.floor(x),by=Math.floor(y),bz=Math.floor(z);
    var b=getB(bx,by,bz);
    if(b&&b!==5)return {x:bx,y:by,z:bz,px:last?last[0]:bx,py:last?last[1]:by,pz:last?last[2]:bz,b:b,dist:t};
    if(!last||bx!==last[0]||by!==last[1]||bz!==last[2])last=[bx,by,bz];
  }
  return null;
}

/* ---------- 原子视角 ---------- */
var atomBuf=null,nAtoms=0;
function buildAtoms(){
  var cx=player.x,cy=player.y+1,cz=player.z,R=13;
  var pos=[];
  var x0=Math.max(0,Math.floor(cx-R)),x1=Math.min(WX-1,Math.floor(cx+R));
  var z0=Math.max(0,Math.floor(cz-R)),z1=Math.min(WZ-1,Math.floor(cz+R));
  var y0=Math.max(0,Math.floor(cy-R)),y1=Math.min(WY-1,Math.floor(cy+R));
  for(var x=x0;x<=x1;x++)for(var z=z0;z<=z1;z++)for(var y=y0;y<=y1;y++){
    var t=getB(x,y,z);
    if(!t)continue;
    var exposed=false;
    for(var i=0;i<6;i++){
      var nb=getB(x+FACES[i].n[0],y+FACES[i].n[1],z+FACES[i].n[2]);
      if(nb===0||nb===5){exposed=true;break;}
    }
    if(!exposed)continue;
    var def=B[t];
    var at=def.atoms||[['C','#888',0.5,0.5,0.5]];
    for(var a=0;a<at.length;a++){
      var el=at[a],col=el[1];
      var cr=parseInt(col.substr(1,2),16)/255,cg=parseInt(col.substr(3,2),16)/255,cb=parseInt(col.substr(5,2),16)/255;
      pos.push(x+el[2],y+el[3],z+el[4],cr,cg,cb);
    }
  }
  nAtoms=pos.length/6;
  if(atomBuf)gl.deleteBuffer(atomBuf);
  atomBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,atomBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
}
function toggleAtom(){
  atomMode=!atomMode;
  document.getElementById('btnAtom').classList.toggle('on',atomMode);
  var pnl=document.getElementById('atomPanel');
  if(atomMode){buildAtoms();pnl.classList.remove('hidden');updateAtomPanel();}
  else pnl.classList.add('hidden');
}
function updateAtomPanel(){
  if(!atomMode)return;
  var h=raycast(8);
  if(!h){
    var tb=getB(Math.floor(player.x),Math.floor(player.y)-1,Math.floor(player.z));
    if(tb)h={b:tb};
  }
  var pnl=document.getElementById('atomPanel');
  if(!h){pnl.innerHTML='<h3>原子视角</h3>方块被拆解成映射真实原子的微粒。<br>对准方块查看成分。';return;}
  var d=B[h.b];
  var els=(d.atoms||[]).map(function(a){
    return '<span class="el" style="background:'+a[1]+'"></span>'+a[0];
  }).join(' ');
  var m=MATS[BLOCK_MAT[h.b]];
  var comp=m?compOf(m):null;
  var compHTML='';
  if(comp){
    var arr=Object.keys(comp).map(function(k){return [k,comp[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
    compHTML=arr.map(function(x){return x[0]+' '+x[1]+'%';}).join(' · ');
  }
  pnl.innerHTML='<h3>'+d.n+(m?(' · '+(m.f&&m.f!=='—'?m.f:m.n)):'')+'</h3>'
    +(compHTML?('元素质量占比：'+compHTML+'<br>'):'')
    +'原子模型：'+els
    +(m?('<br>结构：'+m.struct):'')
    +'<br><span style="opacity:.6">比例与位置为教学示意，用于把方块映射到真实物质构成</span>';
}

/* ---------- AI 指令 ---------- */
function aiSay(html,me){
  var log=document.getElementById('aiLog');
  var d=document.createElement('div');
  if(me)d.className='me';
  d.innerHTML=html;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function forwardSpot(n){
  var d=lookVec();
  return [Math.floor(player.x+d[0]*n),Math.floor(player.y),Math.floor(player.z+d[2]*n)];
}
function surfaceY(x,z){
  for(var y=WY-1;y>=0;y--){var b=getB(x,y,z);if(b&&b!==5)return y+1;}
  return SEA+1;
}
function pickSpawn(){
  var cx=WX>>1,cz=WZ>>1;
  for(var r=0;r<18;r++){
    for(var dx=-r;dx<=r;dx++)for(var dz=-r;dz<=r;dz++){
      var x=cx+dx,z=cz+dz;
      if(x<2||z<2||x>WX-3||z>WZ-3)continue;
      var top=surfaceY(x,z);
      if(top<=SEA+1||getB(x,top-1,z)!==1)continue;
      var clear=true;
      for(var ax=-1;ax<=1&&clear;ax++)for(var az=-1;az<=1&&clear;az++){
        for(var ay=0;ay<5;ay++){
          if(getB(x+ax,top+ay,z+az)!==0){clear=false;break;}
        }
      }
      if(clear)return {x:x+0.5,y:top+0.02,z:z+0.5};
    }
  }
  return {x:cx+0.5,y:surfaceY(cx,cz)+0.05,z:cz+0.5};
}
function buildHouse(){
  var p=forwardSpot(4),bx=p[0],bz=p[2],by=surfaceY(bx,bz);
  for(var dx=-2;dx<=2;dx++)for(var dz=-2;dz<=2;dz++){
    for(var y=0;y<3;y++){
      var edge=(Math.abs(dx)===2||Math.abs(dz)===2);
      if(edge)setB(bx+dx,by+y,bz+dz,8);
    }
  }
  for(var dx2=-2;dx2<=2;dx2++)for(var dz2=-2;dz2<=2;dz2++){
    setB(bx+dx2,by+3,bz+dz2,7);
  }
  // 门洞
  setB(bx,by,bz+2,0);setB(bx,by+1,bz+2,0);
  // 地面铺一下
  for(var dx3=-2;dx3<=2;dx3++)for(var dz3=-2;dz3<=2;dz3++)setB(bx+dx3,by-1,bz+dz3,2);
  buildMesh();aiSay('已在你前方建成 5×5 小屋：木板墙 + 树叶屋顶，南侧留了门洞。',true);
}
function plantTree(){
  var p=forwardSpot(4),bx=p[0],bz=p[2],by=surfaceY(bx,bz);
  for(var y=0;y<5;y++)setB(bx,by+y,bz,6);
  for(var dx=-2;dx<=2;dx++)for(var dz=-2;dz<=2;dz++)for(var dy=3;dy<=5;dy++){
    if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-4)<3)continue;
    if(Math.abs(dx)===2&&Math.abs(dz)===2)continue;
    if(getB(bx+dx,by+dy,bz+dz)===0)setB(bx+dx,by+dy,bz+dz,7);
  }
  setB(bx,by+5,bz,7);
  buildMesh();aiSay('种好了一棵树：原木树干 + 树叶树冠。',true);
}
function flatten(){
  var p=forwardSpot(3),cx=p[0],cz=p[2],h=surfaceY(cx,cz);
  for(var dx=-3;dx<=3;dx++)for(var dz=-3;dz<=3;dz++){
    var x=cx+dx,z=cz+dz;
    for(var y=h;y<WY;y++)if(getB(x,y,z)&&getB(x,y,z)!==5)setB(x,y,z,0);
    for(var y2=0;y2<h;y2++)if(!getB(x,y2,z))setB(x,y2,z,2);
    setB(x,h-1,z,1);
  }
  buildMesh();aiSay('前方 7×7 的地面已平整，并铺上了草方块。',true);
}
function ai(cmd){
  if(cmd==='house')return buildHouse();
  if(cmd==='tree')return plantTree();
  if(cmd==='flat')return flatten();
  if(cmd==='day'){day=!day;aiSay(day?'切到白天：天空与光照已恢复。':'切到夜晚：光照变暗，注意脚下。',true);return;}
  if(cmd==='walk'){player.x=spawn.x;player.z=spawn.z;player.y=spawn.y;player.vy=0;aiSay('已把你送回出生点。',true);return;}
  if(cmd==='what'){
    var h=raycast(8);
    if(!h)return aiSay('对准一个方块再问我，我才能读出它的成分。');
    var d=B[h.b];
    aiSay('你正看着 <b>'+d.n+'</b><br>映射成分：'+d.f,true);
    return;
  }
}

/* ---------- 渲染 ---------- */
var VP=new Float32Array(16),MVP=new Float32Array(16),proj=null;
var day=true;
var apos,anrm,acol,apos2,acol2;
function resize(){
  var dpr=Math.min(devicePixelRatio||1,2);
  var w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  gl.viewport(0,0,w,h);
  proj=mPersp(70*Math.PI/180,innerWidth/innerHeight,0.08,150);
}
addEventListener('resize',resize);

function glChk(tag){var e=gl.getError();if(e&&window.console)console.log('GLERR',tag,e);}
var last=0,frame=0,tick=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  updatePlayer(dt);
  var eye,lookYaw=player.yaw,pitch=player.pitch;
  if(thirdPerson){
    var sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
    var camX=player.x+sy*5.6,camZ=player.z+cy*5.6;
    var camY=Math.max(player.y+2.2,surfaceY(Math.floor(camX),Math.floor(camZ))+0.6);
    eye=[camX,camY,camZ];
    var ddy=(player.y+1.05)-camY, dh=Math.hypot(player.x-camX,player.z-camZ);
    pitch=Math.atan2(ddy,Math.max(0.1,dh));
  }else{
    eye=eyePos();
  }
  var view=mView(eye,lookYaw,pitch);
  var mv=mMul(proj,view,VP);MVP.set(mv);
  var sky=day?[0.55,0.72,0.95]:[0.04,0.06,0.12];
  gl.clearColor(sky[0],sky[1],sky[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  var dim=atomMode?0.32:(day?1:0.45);
  if(mesh.opaque&&mesh.nOpaque){
    gl.useProgram(P_BLOCK);
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.opaque);
    gl.vertexAttribPointer(BLpos,3,gl.FLOAT,false,36,0);
    gl.vertexAttribPointer(BLcol,3,gl.FLOAT,false,36,24);
    gl.enableVertexAttribArray(BLpos);gl.enableVertexAttribArray(BLcol);
    gl.uniformMatrix4fv(UB.mvp,false,MVP);
    gl.uniform3f(UB.eye,eye[0],eye[1],eye[2]);
    gl.uniform3f(UB.sky,sky[0],sky[1],sky[2]);
    gl.uniform1f(UB.dim,dim);
    gl.uniform1f(UB.alpha,1);
    gl.drawArrays(gl.TRIANGLES,0,mesh.nOpaque);
  }

  // 角色（方块拼装，复用方块管线）
  var t=ts/1000;
  var npx=npc.x,npz=npc.z;
  var off=0;
  if(thirdPerson)off=bakeChar(off,player.x,player.y,player.z,player.yaw,Math.sin((player.walk||0))*0.55,0);
  off=bakeChar(off,npx,surfaceY(Math.floor(npx),Math.floor(npz)),npz,0.9,0,Math.sin(t*2)*0.35);
  if(off>0){
    gl.useProgram(P_BLOCK);
    gl.bindBuffer(gl.ARRAY_BUFFER,charBuf);
    gl.bufferData(gl.ARRAY_BUFFER,charArr.subarray(0,off),gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(BLpos,3,gl.FLOAT,false,36,0);
    gl.vertexAttribPointer(BLcol,3,gl.FLOAT,false,36,24);
    gl.enableVertexAttribArray(BLpos);gl.enableVertexAttribArray(BLcol);
    gl.uniformMatrix4fv(UB.mvp,false,MVP);
    gl.uniform3f(UB.eye,eye[0],eye[1],eye[2]);
    gl.uniform3f(UB.sky,sky[0],sky[1],sky[2]);
    gl.uniform1f(UB.dim,dim);
    gl.uniform1f(UB.alpha,1);
    gl.drawArrays(gl.TRIANGLES,0,off/9);
  }
  window.__dbg={p:[player.x,player.y,player.z],eye:eye,tp:thirdPerson,off:off};

  // 水
  if(mesh.water&&mesh.nWater){
    gl.useProgram(P_BLOCK);
    gl.bindBuffer(gl.ARRAY_BUFFER,mesh.water);
    gl.vertexAttribPointer(BLpos,3,gl.FLOAT,false,36,0);
    gl.vertexAttribPointer(BLcol,3,gl.FLOAT,false,36,24);
    gl.enableVertexAttribArray(BLpos);gl.enableVertexAttribArray(BLcol);
    gl.uniformMatrix4fv(UB.mvp,false,MVP);
    gl.uniform3f(UB.eye,eye[0],eye[1],eye[2]);
    gl.uniform3f(UB.sky,sky[0],sky[1],sky[2]);
    gl.uniform1f(UB.dim,dim);
    gl.uniform1f(UB.alpha,0.55);
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.drawArrays(gl.TRIANGLES,0,mesh.nWater);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  // 原子
  if(atomMode&&atomBuf){
    gl.useProgram(P_PT);
    gl.bindBuffer(gl.ARRAY_BUFFER,atomBuf);
    gl.vertexAttribPointer(PTpos,3,gl.FLOAT,false,24,0);
    gl.vertexAttribPointer(PTcol,3,gl.FLOAT,false,24,12);
    gl.enableVertexAttribArray(PTpos);gl.enableVertexAttribArray(PTcol);
    gl.uniformMatrix4fv(UP.mvp,false,MVP);
    gl.uniform1f(UP.size,Math.max(4,Math.min(11,(devicePixelRatio||1)*5)));
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    gl.drawArrays(gl.POINTS,0,nAtoms);
    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
  }

  if(atomMode&&(frame++%20===0)){buildAtoms();updateAtomPanel();}
  if(tick++%12===0){
    var hh=raycast(6);
    if(!hh){var tb=getB(Math.floor(player.x),Math.floor(player.y)-1,Math.floor(player.z));if(tb)hh={b:tb};}
    var inf=document.getElementById('info');
    var mm=hh?MATS[BLOCK_MAT[hh.b]]:null;
    inf.innerHTML='坐标 '+player.x.toFixed(1)+' , '+player.y.toFixed(1)+' , '+player.z.toFixed(1)+(hh?('<br>'+B[hh.b].n+(mm?(' · '+mm.n+' '+mm.f):'')+'<br><span style="opacity:.7">'+(mm?mm.props:B[hh.b].f)+'</span>'):'');
  }
  requestAnimationFrame(loop);
}

var parseFormula=function(f){
  var stack=[{}],i=0;
  while(i<f.length){
    var ch=f[i];
    if(ch==='('){stack.push({});i++;continue;}
    if(ch===')'){
      var g=stack.pop();i++;
      var n='';while(i<f.length&&/\d/.test(f[i]))n+=f[i++];
      var mul=n?+n:1;
      for(var k in g)stack[stack.length-1][k]=(stack[stack.length-1][k]||0)+g[k]*mul;
      continue;
    }
    if(/[A-Z]/.test(ch)){
      var sym=ch;i++;
      while(i<f.length&&/[a-z]/.test(f[i]))sym+=f[i++];
      var num='';while(i<f.length&&/\d/.test(f[i]))num+=f[i++];
      var cnt=num?+num:1;
      var top=stack[stack.length-1];
      top[sym]=(top[sym]||0)+cnt;
      continue;
    }
    i++;
  }
  return stack[0];
};
function compOf(m){
  if(m.comp)return m.comp;
  if(!m.f||m.f==='—')return null;
  var c=parseFormula(m.f),tot=0,out={};
  for(var s in c){if(!EMAP[s])continue;tot+=c[s]*EMAP[s][3];}
  if(!tot)return null;
  for(var s2 in c){if(!EMAP[s2])continue;out[s2]=Math.round(c[s2]*EMAP[s2][3]/tot*1000)/10;}
  return out;
}
function elColor(sym){
  var m={O:'#e05050',Si:'#c9b18a',Al:'#b9c0cc',Fe:'#c98a5a',Ca:'#8fd6a8',C:'#8a8a8a',H:'#e8eefc',Na:'#e6b85c',Cl:'#8fe08f',K:'#c58ad8',Mg:'#5fbf5f',S:'#e8d44d',N:'#7ea6ff',Cu:'#d08a4a',Zn:'#c8ccd2',Mn:'#b07a9a',P:'#e8a05a',F:'#9fe0b8',Ti:'#9aa8b8'};
  return m[sym]||'#9db0c6';
}
function fmtNum(v,d){if(v==null||v===0&&d===undefined)return '—';return v;}
function kelvin(v){return v==null?'—':(Math.round((v-273.15)*10)/10)+' °C';}
function catClass(c){return 'cat-'+c;}

/* 元素周期表位置 */
function posOf(z){
  if(z===1)return[1,1];if(z===2)return[1,18];
  if(z<=10){var c2=[1,2,13,14,15,16,17,18];return[2,c2[z-3]];}
  if(z<=18){var c3=[1,2,13,14,15,16,17,18];return[3,c3[z-11]];}
  if(z<=36)return[4,z-18];
  if(z<=54)return[5,z-36];
  if(z<=56)return[6,z-54];
  if(z<=71)return[8,z-54];      // 镧系 57-71 -> 第8行 3..17
  if(z<=86)return[6,z-68];      // 72-86 -> 4..18
  if(z<=88)return[7,z-86];
  if(z<=103)return[9,z-86];     // 锕系 89-103
  return[7,z-100];              // 104-118 -> 4..18
}

/* ---------- 化学面板 ---------- */
function elHTML(z){
  var e=ELEMENTS[z-1];
  return '<div class="detail"><h3>'+e[2]+' <span class="badge">'+e[1]+' · Z='+e[0]+'</span></h3>'+
    '<div class="kv"><span>相对原子质量</span><span>'+e[3]+'</span></div>'+
    '<div class="kv"><span>类别</span><span>'+e[8]+'</span></div>'+
    '<div class="kv"><span>熔点</span><span>'+kelvin(e[4])+'</span></div>'+
    '<div class="kv"><span>沸点</span><span>'+kelvin(e[5])+'</span></div>'+
    '<div class="kv"><span>密度</span><span>'+(e[6]==null?'—':e[6]+' g/cm³')+'</span></div>'+
    '<div class="kv"><span>电负性（鲍林）</span><span>'+(e[7]==null?'—':e[7])+'</span></div>'+
    '<div class="kv"><span>地壳丰度</span><span>'+(e[9]>=1?e[9].toLocaleString()+' ppm':(e[9]>0?e[9]+' ppm（痕量）':'—'))+'</span></div>'+
    ((e[9]>0)?('<div class="bar"><i style="width:'+Math.max(2,Math.min(100,Math.log10(e[9]+1)/Math.log10(480000)*100))+'%"></i></div><div class="mut" style="font-size:10px">对数刻度，以地壳氧丰度为上限</div>'):'')+
    '<div class="mut" style="margin-top:6px">主要存在形式：'+occursOf(e[1])+'</div></div>';
}
function occursOf(sym){
  var out=[];
  for(var k in MATS){
    var m=MATS[k];
    if(m.f&&m.f!=='—'&&m.f.indexOf(sym)>=0){out.push(m.n);}
    else if(m.comp&&m.comp[sym])out.push(m.n);
    if(out.length>=4)break;
  }
  return out.length?out.join('、'):'以微量形式散布于岩石与土壤';
}
var chemTab='table';
function openChem(tab){
  document.getElementById('chem').classList.remove('hidden');
  if(tab)setChemTab(tab);
  if(chemTab==='dist')renderDist();
  if(!window.__ptBuilt)buildPtable();
}
function closeChem(){document.getElementById('chem').classList.add('hidden');}
function setChemTab(t){
  chemTab=t;
  ['table','mats','react','dist'].forEach(function(k){
    document.getElementById('cpanel-'+k).classList.toggle('hidden',k!==t);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.ctabs button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-ctab')===t);
  });
  if(t==='mats')renderMats();
  if(t==='react'){fillReactSelects();}
  if(t==='dist')renderDist();
}
function buildPtable(){
  var box=document.getElementById('ptable');
  var html='';
  ELEMENTS.forEach(function(e){
    var p=posOf(e[0]);
    html+='<div class="ecell '+catClass(e[8])+'" data-z="'+e[0]+'" style="grid-row:'+p[0]+';grid-column:'+p[1]+'" title="'+e[2]+' '+e[1]+'">'+e[0]+'<b>'+e[1]+'</b></div>';
  });
  box.innerHTML=html;
  box.addEventListener('click',function(ev){
    var c=ev.target.closest('.ecell');
    if(!c)return;
    Array.prototype.forEach.call(box.querySelectorAll('.ecell.sel'),function(x){x.classList.remove('sel');});
    c.classList.add('sel');
    document.getElementById('elDetail').innerHTML=elHTML(+c.getAttribute('data-z'));
  });
  window.__ptBuilt=1;
}
function renderMats(){
  var box=document.getElementById('matList');
  var html='';
  for(var id in MATS){
    var m=MATS[id];
    if(!m.block)continue;
    html+='<div class="mcard" data-mid="'+id+'"><span class="sw" style="background:'+m.color+'"></span><div><div class="mn">'+m.n+'</div><div class="mf">'+m.f+'</div></div></div>';
  }
  box.innerHTML=html;
  box.onclick=function(ev){
    var c=ev.target.closest('.mcard');
    if(!c)return;
    Array.prototype.forEach.call(box.querySelectorAll('.mcard'),function(x){x.classList.remove('sel');});
    c.classList.add('sel');
    showMat(c.getAttribute('data-mid'));
  };
  showMat('water');
}
function showMat(id){
  var m=MATS[id];if(!m)return;
  var comp=compOf(m);
  var compHTML='';
  if(comp){
    var arr=Object.keys(comp).map(function(k){return [k,comp[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
    compHTML='<div class="catline">元素质量占比</div>'+arr.map(function(x){
      return '<div class="kv"><span><span class="el" style="background:'+elColor(x[0])+'"></span>'+x[0]+'</span><span>'+x[1]+'%</span></div>';
    }).join('');
  }
  var rxs=RX.filter(function(r){return r.a===id||r.b===id||(r.out&&r.out.indexOf(id)>=0);}).slice(0,4);
  document.getElementById('matDetail').innerHTML='<h3>'+m.n+' <span class="badge">'+m.f+'</span><span class="badge">'+m.st+'</span></h3>'+
    '<div class="kv"><span>物理性质</span><span>'+m.props+'</span></div>'+
    '<div class="kv"><span>微观结构</span><span>'+m.struct+'</span></div>'+
    '<div class="kv"><span>世界分布</span><span>'+m.where+'</span></div>'+compHTML+
    (rxs.length?('<div class="catline">相关反应</div>'+rxs.map(function(r){return '<div class="kv"><span>'+r.eq+'</span><span>'+r.cond+'</span></div>';}).join('')):'');
}
function fillReactSelects(){
  var opts='';
  var groupA='',groupB='';
  for(var id in MATS){
    var m=MATS[id];
    var o='<option value="'+id+'">'+m.n+'（'+m.f+'）</option>';
    if(m.block)groupA+=o;else groupB+=o;
  }
  opts='<optgroup label="世界中的物质">'+groupA+'</optgroup><optgroup label="反应体系中的物质">'+groupB+'</optgroup>';
  var A=document.getElementById('rA'),Bx=document.getElementById('rB');
  if(!A.options.length||A.options.length<10){
    A.innerHTML=opts;Bx.innerHTML='<option value="">— 无（单一物质反应）—</option>'+opts;
    A.value='limestone';Bx.value='';
  }
}
function runReaction(){
  var a=document.getElementById('rA').value;
  var b=document.getElementById('rB').value;
  var cond=document.getElementById('rCond').value;
  var amt=document.getElementById('rAmt').value;
  var hit=null;
  for(var i=0;i<RX.length;i++){
    var r=RX[i];
    if(r.cond!==cond)continue;
    if(r.amt&&r.amt!==amt)continue;
    var pairOK=(r.a===a&&((r.b||'')===(b||'')))||(r.a===b&&(r.b||'')===a&&!r.noReverse);
    if(pairOK){hit=r;break;}
  }
  var out=document.getElementById('rOut');
  if(!hit){
    out.innerHTML='<h3>没有观察到明显反应</h3><span class="mut">在 '+cond+'、'+amt+' 条件下，'+(MATS[a]?MATS[a].n:a)+' 与 '+(MATS[b]?MATS[b].n:b)+' 没有登记在案的直接反应。</span><br><span class="mut">现实中的化学反应还取决于浓度、压强、催化剂与接触面积。</span>';
    return;
  }
  var prods=hit.out.map(function(id){return MATS[id]||{n:id,f:''};});
  var html='<h3>发生反应：'+hit.eq+'</h3>'+
    '<div class="kv"><span>反应物</span><span>'+(MATS[hit.a]?MATS[hit.a].n:hit.a)+(hit.b?(' + '+(MATS[hit.b]?MATS[hit.b].n:hit.b)):'')+'</span></div>'+
    '<div class="kv"><span>条件</span><span>'+hit.cond+(hit.amt?(' · '+hit.amt):'')+'</span></div>'+
    '<div class="kv"><span>生成物</span><span>'+prods.map(function(p){return p.n+'（'+p.f+'）';}).join('、')+'</span></div>'+
    (hit.note?'<div class="kv"><span>说明</span><span>'+hit.note+'</span></div>':'')+
    (hit.order?'<div class="kv"><span>加入顺序</span><span>'+(b&&hit.a===b&&hit.b===a?('你把「'+MATS[b].n+'」加入「'+MATS[a].n+'」。'+hit.order):hit.order)+'</span></div>':'');
  var placeable=hit.out.filter(function(id){return MATS[id]&&MATS[id].block;});
  if(placeable.length){
    html+='<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+placeable.map(function(id){
      return '<button class="mbtn" data-place="'+id+'" style="border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#eaf2ff;border-radius:8px;padding:8px 10px;font-size:12px">把 '+MATS[id].n+' 放入世界</button>';
    }).join('')+'</div>';
  }
  out.innerHTML=html;
  out.querySelectorAll('[data-place]').forEach(function(btn){
    btn.addEventListener('click',function(){placeSubstance(btn.getAttribute('data-place'));});
  });
}
function placeSubstance(id){
  var m=MATS[id];if(!m||!m.block)return;
  var d=lookVec(),x=Math.floor(player.x+d[0]*3),z=Math.floor(player.z+d[2]*3);
  var y=surfaceY(x,z);
  for(var yy=y;yy<Math.min(WY-2,y+6);yy++){if(getB(x,yy,z)===0){y=yy;break;}}
  setB(x,y,z,m.block);buildMesh();
  closeChem();
  toast('已把『'+m.n+'』放入世界（'+B[m.block].n+'）');
}

/* ---------- 分布 ---------- */
function renderDist(){
  var top=ELEMENTS.slice().sort(function(a,b){return b[9]-a[9];}).slice(0,14);
  var max=top[0][9];
  document.getElementById('abund').innerHTML=top.map(function(e){
    var w=Math.max(1.5,Math.log10(e[9]+1)/Math.log10(max+1)*100);
    return '<div class="arow"><span class="sym">'+e[1]+'</span><span class="ab"><i style="width:'+w+'%"></i></span><span class="pc">'+(e[9]>=1000?(e[9]/10000).toFixed(2)+' %':e[9]+' ppm')+'</span></div>';
  }).join('');
  var counts={},tot=0;
  for(var i=0;i<blocks.length;i++){var t=blocks[i];if(t){counts[t]=(counts[t]||0)+1;tot++;}}
  var dep=[
    ['草方块 / 泥土','地表 0–1 层，腐殖土（O、Si、Al、Fe、C）'],
    ['花岗岩（石头）','地下 0–15 m，石英 + 长石 + 云母'],
    ['石英砂','水边与海底，SiO₂ 碎屑'],
    ['石灰石','地下 2–7 m，CaCO₃ 沉积层'],
    ['煤','地下 3–10 m，C 与挥发分'],
    ['赤铁矿','地下 3–12 m，Fe₂O₃ 矿脉'],
    ['岩盐','海平面附近，NaCl 盐层'],
    ['水','海平面以下的湖泊与海洋']
  ];
  document.getElementById('dist').innerHTML=dep.map(function(d){
    return '<div class="dep"><span>'+d[0]+'</span><span class="mut" style="text-align:right">'+d[1]+'</span></div>';
  }).join('')+'<div class="mut" style="margin-top:10px;font-size:11px">当前世界共 '+tot.toLocaleString()+' 个方块，其中矿石：赤铁矿 '+(counts[9]||0)+'、煤 '+(counts[10]||0)+'、石灰石 '+(counts[11]||0)+'、岩盐 '+(counts[12]||0)+'。生成规则按地壳丰度与成矿深度近似映射。</div>';
}


function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity=1;
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.opacity=0;},1500);
}
function buildHotbar(){
  var hb=document.getElementById('hotbar');
  hb.innerHTML=hotbarTypes.map(function(t){
    var d=B[t],c=d.top||d.side||d.col;
    return '<div class="slot'+(t===sel?' on':'')+'" data-type="'+t+'"><div class="sw" style="background:rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')"></div>'+HOTNAME[t]+'</div>';
  }).join('');
  Array.prototype.forEach.call(hb.querySelectorAll('.slot'),function(s){
    s.addEventListener('click',function(){
      sel=Number(s.getAttribute('data-type'));
      Array.prototype.forEach.call(hb.querySelectorAll('.slot'),function(x){x.classList.remove('on');});
      s.classList.add('on');
    });
  });
}
Array.prototype.forEach.call(document.querySelectorAll('#acts button'),function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();});
  b.addEventListener('click',function(){
    var a=b.getAttribute('data-act');
    if(a==='jump')jump();else if(a==='dig')dig();else if(a==='place')place();else if(a==='inspect')inspect();
  });
});
document.getElementById('btnAtom').addEventListener('click',toggleAtom);
document.getElementById('btnView').addEventListener('click',function(){
  thirdPerson=!thirdPerson;
  this.classList.toggle('on',thirdPerson);
  toast(thirdPerson?'第三人称：能看到自己与路人':'第一人称');
});
document.getElementById('btnAI').addEventListener('click',function(){
  document.getElementById('aiPanel').classList.toggle('hidden');
});
document.getElementById('aiClose').addEventListener('click',function(){document.getElementById('aiPanel').classList.add('hidden');});
Array.prototype.forEach.call(document.querySelectorAll('#aiPanel .cmds button'),function(b){
  b.addEventListener('click',function(){
    var cmd=b.getAttribute('data-cmd');
    aiSay('<div style="opacity:.75">'+b.textContent+'</div>');
    ai(cmd);
    if(atomMode)updateAtomPanel();
  });
});
addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('aiPanel').classList.add('hidden');closeChem();}});

/* 化学面板绑定 */
document.getElementById('btnChem').addEventListener('click',function(){openChem('table');});
document.getElementById('chemBack').addEventListener('click',closeChem);
Array.prototype.forEach.call(document.querySelectorAll('.ctabs button'),function(b){
  b.addEventListener('click',function(){setChemTab(b.getAttribute('data-ctab'));});
});
document.getElementById('rSwap').addEventListener('click',function(){
  var a=document.getElementById('rA'),b=document.getElementById('rB');
  var t=a.value;a.value=b.value;b.value=t;
});
document.getElementById('rRun').addEventListener('click',runReaction);

/* ---------- 启动 ---------- */
resize();
genWorld();
var sp=pickSpawn();
player.x=sp.x;player.y=sp.y;player.z=sp.z;player.vy=0;
spawn={x:sp.x,y:sp.y,z:sp.z};
npc={x:sp.x-Math.sin(player.yaw)*7+Math.cos(player.yaw)*3.5,z:sp.z-Math.cos(player.yaw)*7-Math.sin(player.yaw)*3.5};
buildMesh();
buildHotbar();
requestAnimationFrame(function(t){last=t;loop(t);});
setTimeout(function(){document.getElementById('hint').style.opacity='0';document.getElementById('hint').style.transition='opacity 1.2s';},9000);
})();
</script>
