<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07c160">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/m/manifest">
<link rel="apple-touch-icon" href="/m/icon">
<title>极简聊天</title>
<style>
:root{ --bg:#ededed; --panel:#ffffff; --top:#f7f7f7; --text:#1e1e1e; --sub:#969696; --border:#e6e6e6; --mine:#95ec69; --mine-text:#1e1e1e; --other:#ffffff; --other-text:#1e1e1e; --sys:#a0a0a0; --green:#07c160; --red:#f43530; --inputbg:#ffffff; }
[data-theme="dark"]{ --bg:#17171a; --panel:#1f1f24; --top:#1c1c20; --text:#e8e8e8; --sub:#8a8a8a; --border:#33333a; --mine:#62c680; --mine-text:#10241a; --other:#2b2b31; --other-text:#f0f0f0; --sys:#7a7a82; --inputbg:#2b2b31; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg)}
#mainView{flex:1;display:flex;flex-direction:column;min-height:0}
.hidden{display:none!important}
/* ---------- 登录 ---------- */
#loginView{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#07c160,#059d4d);padding:24px}
.card{width:100%;max-width:340px;background:var(--panel);border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.logo{font-size:44px}
.card h1{font-size:20px;margin:6px 0 4px;color:var(--text)}
.sub{font-size:12px;color:var(--sub);margin-bottom:18px;line-height:1.6}
.card input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;background:var(--inputbg);color:var(--text);margin-bottom:10px}
.btn-primary{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600}
.link{margin-top:12px;font-size:13px;color:var(--green);cursor:pointer}
.err{margin-top:10px;font-size:12px;color:#e64340;min-height:16px}
.conn{margin-top:8px;font-size:12px;text-align:center;min-height:16px;line-height:1.5}
.conn.ok{color:#07a354}
.conn.bad{color:#e64340}
.ver{font-size:10px;color:#aaa;margin-top:8px}
/* ---------- 头部 ---------- */
header{height:50px;background:#26282c;color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
header .me{font-size:13px;display:flex;align-items:center;gap:6px;min-width:0;flex:1}
header .title{flex:0 0 auto;font-weight:600;font-size:15px}
.avatar{width:36px;height:36px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.avatar.small{width:24px;height:24px;font-size:12px;border-radius:6px}
.icon-btn{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;flex-shrink:0}
/* ---------- 会话 ---------- */
#sessionView{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
#sessionList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sessionActions{display:flex;gap:8px;padding:8px;border-top:1px solid var(--border);background:var(--top);flex-shrink:0}
#sessionActions button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:var(--inputbg);color:var(--text);font-size:14px}
#sessionActions .primary{background:var(--green);color:#fff;border:none;font-weight:600}
.session{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
.session:active{background:var(--bg)}
.session .info{flex:1;min-width:0}
.session .name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px}
.session .prev{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.session .right{text-align:right;flex-shrink:0}
.session .time{font-size:11px;color:var(--sub)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;padding:0 5px;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.off{background:#ccc}
/* ---------- 聊天 ---------- */
#chatView{flex:1;min-height:0;display:flex;flex-direction:column}
.chathead{height:46px;background:var(--top);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 8px;flex-shrink:0}
.backbtn{font-size:24px;background:none;border:none;color:var(--text);padding:2px 10px;cursor:pointer;flex-shrink:0}
.chattitle{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatsub{font-size:12px;color:var(--sub);flex-shrink:0}
#membersBtn{border-color:var(--border);color:var(--text);background:var(--inputbg)}
#msgList{flex:1;min-height:0;overflow-y:auto;padding:12px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#msgList::-webkit-scrollbar{width:8px}
#msgList::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:8px}
#msgList::-webkit-scrollbar-track{background:transparent}
#toLatest{position:absolute;right:14px;bottom:82px;z-index:6;padding:8px 14px;border-radius:999px;border:none;background:#0f9d58;color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#scrollRail{position:absolute;right:2px;width:6px;background:rgba(0,0,0,.07);border-radius:4px;z-index:6;touch-action:none;display:none}
#scrollThumb{position:absolute;left:0;width:6px;border-radius:4px;background:rgba(0,0,0,.34);min-height:26px}
#chatView{position:relative}
.msg-row{display:flex;flex-direction:column;margin-bottom:12px}
.msg-row.mine{align-items:flex-end}
.msg-row.other{align-items:flex-start}
.msg-row.system{align-items:center;margin:8px 0}
.msg-name{font-size:11px;color:var(--sub);margin:0 4px 3px}
.bubble{max-width:74%;padding:9px 12px;border-radius:10px;font-size:15px;line-height:1.45;word-break:break-word;position:relative}
.mine .bubble{background:var(--mine);color:var(--mine-text)}
.other .bubble{background:var(--other);color:var(--other-text);border:1px solid var(--border)}
.system .bubble{background:transparent;color:var(--sys);font-size:12px;padding:3px 8px}
.bubble.emoji{background:transparent!important;border:none!important;padding:2px;font-size:40px;line-height:1.2}
.msg-time{font-size:10px;color:var(--sub);margin:3px 4px 0}
.msg-status{font-size:10px;color:var(--sub)}
.imgwrap{max-width:74%;position:relative}
.imgwrap img{max-width:100%;max-height:230px;border-radius:8px;display:block}
.img-loading{font-size:11px;color:var(--sub);padding:4px 6px}
.filechip{display:flex;flex-direction:column;gap:4px;min-width:180px}
.filechip .fn{font-size:13px;font-weight:600;word-break:break-all}
.filechip .fs{font-size:11px;color:var(--sub)}
.filechip .row{display:flex;gap:8px;margin-top:2px}
.filechip button{flex:1;padding:5px 0;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.inputbar{display:flex;gap:5px;padding:8px;background:var(--top);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.inputbar input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none;background:var(--inputbg);color:var(--text)}
.holdtalk{flex:1;min-width:0;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--inputbg);color:var(--text);font-size:15px;font-weight:600;touch-action:none}
.holdtalk.rec{background:#e6f7ea;border-color:var(--green);color:#067a3c}
.holdtalk.cancel{background:#fdecec;border-color:#e64340;color:#c62828}
[data-theme="dark"] .holdtalk.rec{background:#1d3b2b;color:#8bdcaa}
[data-theme="dark"] .holdtalk.cancel{background:#43201f;color:#ff9c99}
.bar-btn{width:34px;height:38px;border:1px solid var(--border);border-radius:8px;background:var(--inputbg);font-size:15px;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text)}
.bar-btn svg{display:block}
#chatView .chatcall svg{display:block}
.bar-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
#sendBtn{width:56px;height:38px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;flex-shrink:0}
#chatView .chatcall{background:none;border:none;font-size:18px;padding:0 3px;color:var(--text);flex-shrink:0}
/* 录音提示条 */
#recHint{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.78);color:#fff;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#recHint .dot{width:8px;height:8px;border-radius:50%;background:#f43530;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.25}}
/* 语音消息 */
.voicebubble{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.mine .voicebubble{background:var(--mine);color:var(--mine-text)}
.other .voicebubble{background:var(--other);color:var(--other-text);border:1px solid var(--border)}
.voicebubble .vicon{font-size:12px;width:14px;text-align:center;flex-shrink:0}
.voicebubble .vbars{display:flex;align-items:center;gap:2px;height:18px;flex:1}
.voicebubble .vbars i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.32}
.voicebubble .vbars i.on{opacity:.9}
.voicebubble .vbars i:nth-child(3n){height:16px}
.voicebubble .vbars i:nth-child(3n+1){height:9px}
.voicebubble .vbars i:nth-child(3n+2){height:13px}
.voicebubble .vdur{font-size:12px;opacity:.7;min-width:24px;text-align:right;flex-shrink:0}
.vtrans{margin-top:4px;max-width:74%;font-size:12px;color:var(--sub);background:var(--other);border:1px solid var(--border);border-radius:8px;padding:6px 9px;line-height:1.5;word-break:break-word}
.mine .vtrans{background:var(--inputbg)}
/* ---------- 聊天信息页 ---------- */
#chatInfo,#chatSearch{position:fixed;inset:0;z-index:140;background:var(--bg);display:flex;flex-direction:column}
.infohead{flex-shrink:0;display:flex;align-items:center;padding:0 6px;min-height:52px;background:var(--top);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.backbtn{width:40px;height:44px;border:none;background:none;color:var(--text);font-size:28px;line-height:1;padding:0}
.infohead .infotitle{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--text)}
.infohead .bellbtn{width:44px;height:44px;border:none;background:none;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center}
.infohead .bellbtn svg{display:block}
.infohead .bellbtn .slash{display:none}
.infohead .bellbtn.muted .slash{display:block}
.infobody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.info-sec{margin-top:10px;background:var(--top);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.info-row{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;font-size:15px;color:var(--text);border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-row .chev{color:var(--sub);font-size:17px}
.info-row:active{background:var(--inputbg)}
.sw{position:relative;width:46px;height:28px;flex-shrink:0;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;background:#d9dce1;border-radius:14px;transition:background .18s}
.sw i:after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s}
.sw input:checked + i{background:var(--green)}
.sw input:checked + i:after{transform:translateX(18px)}
[data-theme="dark"] .sw i{background:#3a3d45}
.info-members{display:flex;gap:18px;padding:16px;overflow-x:auto;align-items:flex-start;background:var(--top);border-bottom:1px solid var(--border)}
.mchip{display:flex;flex-direction:column;align-items:center;gap:6px;width:52px;flex-shrink:0}
.mchip .mav{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:600}
.mchip .mnm{font-size:11px;color:var(--sub);max-width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile{width:48px;height:48px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--sub);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#bgPicker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 2px 4px}
#bgPicker button{height:72px;border-radius:10px;border:2px solid transparent;font-size:12px;color:#555;background:#f2f2f2}
#bgPicker button.on{border-color:var(--green)}
#bgPicker button.lbl{display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
[data-theme="dark"] #bgPicker button{color:#ddd}
#searchInput{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--inputbg);color:var(--text);font-size:15px;outline:none;margin-right:8px}
#searchResults{flex:1;overflow-y:auto}
.sres{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--top)}
.sres .sav{width:34px;height:34px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sres .st{font-size:11px;color:var(--sub);margin-bottom:3px}
.sres .sx{font-size:14px;color:var(--text);word-break:break-word;line-height:1.45}
.sres .sx em{background:#ffe58f;color:#333;font-style:normal;border-radius:3px}
#searchEmpty{padding:46px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.flash{animation:flashMsg 1.3s}
@keyframes flashMsg{0%,100%{background:transparent}25%{background:rgba(7,193,96,.22)}}
.session .foldico{font-size:19px;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:#c9cdd4}
.sess-mute{font-size:10px;margin-right:3px;opacity:.55}
#chatInfoBtn{font-size:22px;line-height:1;padding:0 2px 6px}
/* 通话 */
#callView,#incomingView{position:fixed;inset:0;z-index:300;background:#0b0d10;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#callView{background:linear-gradient(160deg,#161b24,#08090c)}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#callView.audio #remoteVideo{opacity:0}
#localVideo{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:100px;height:144px;object-fit:cover;border-radius:12px;background:#222;z-index:3;transform:scaleX(-1);border:1px solid rgba(255,255,255,.2)}
.callTop{position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2;pointer-events:none}
#callView.audio .callTop{top:50%;transform:translateY(-62%)}
.callName{font-size:21px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.callState{font-size:13px;opacity:.82;margin-top:6px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#callAvatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 0 16px;z-index:2}
.callBar{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:26px;z-index:4}
.callBtn{width:58px;height:58px;border-radius:50%;border:none;font-size:22px;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center}
.callBtn.lbl{font-size:15px;font-weight:600;letter-spacing:1px}
#callView .callBtn svg{display:block}
.callBtn.on{background:#fff;color:#111}
.callBtn.hang{background:#f43530}
#callView.video #callAvatar{display:none}
#callView.video .callTop{top:calc(12px + env(safe-area-inset-top))}
#incomingView{background:linear-gradient(160deg,#1a2230,#090b10)}
#incAvatar{width:104px;height:104px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
#incName{font-size:23px;font-weight:600}
#incType{font-size:13px;opacity:.75;margin-top:8px}
.incBtns{display:flex;gap:44px;margin-top:38px}
.incBtns button{width:64px;height:64px;border-radius:50%;border:none;font-size:15px;font-weight:600;color:#fff}
#acceptBtn{background:#07c160}
#rejectBtn{background:#f43530}
#sysHint{padding:10px;text-align:center;font-size:12px;color:var(--sub);background:var(--top);border-top:1px solid var(--border);flex-shrink:0}
/* ---------- 表情(微信式面板: 输入栏下方的独立区域) ---------- */
#emojiPanel{flex:0 0 auto;height:min(44vh,300px);min-height:184px;display:flex;flex-direction:column;background:var(--top);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body.emoji-open #inputbar{padding-bottom:8px}
body.emoji-open #toLatest{display:none}
#emojiScroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 10px 8px}
#emojiScroll::-webkit-scrollbar{width:6px}
#emojiScroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:6px}
#emojiScroll::-webkit-scrollbar-track{background:transparent}
.emoji-sec{font-size:12px;color:var(--sub);padding:10px 2px 4px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid button{height:44px;font-size:28px;line-height:1;background:none;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.emoji-grid button:active{background:rgba(0,0,0,.08);transform:scale(.9)}
#emojiBar{display:flex;align-items:center;gap:2px;padding:4px 8px;border-top:1px solid var(--border);background:var(--top);flex-shrink:0}
#emojiBar .etab{width:44px;height:34px;border:none;background:none;font-size:20px;line-height:1;border-radius:8px;opacity:.5;cursor:pointer}
#emojiBar .etab.on{opacity:1;background:var(--inputbg);box-shadow:inset 0 0 0 1px var(--border)}
#emojiBar .spacer{flex:1}
#emojiBar .ebtn{width:44px;height:34px;border:none;background:none;font-size:18px;color:var(--text);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#emojiBar .ebtn svg{display:block}
#emojiBar .ebtn:active{background:rgba(0,0,0,.08)}
/* ---------- 弹窗 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:160;display:flex;align-items:flex-end}
.modal{width:100%;max-width:560px;margin:0 auto;max-height:78vh;background:var(--panel);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}
.modal-head .icon-btn{border-color:var(--border);color:var(--text);background:none}
.modal-body{overflow-y:auto;padding:10px 12px;flex:1;min-height:0}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.mrow .minfo{flex:1;min-width:0}
.mrow .mname{font-size:14px}
.mrow .mtag{font-size:11px;color:var(--sub)}
.mrow button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;flex-shrink:0;margin-left:6px}
.mrow button.danger{background:var(--red);color:#fff;border:none}
.msec{font-size:13px;font-weight:600;padding:10px 4px 4px;color:var(--text)}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var EMOJI_CATS=[
  {name:'表情',list:["😀","😁","😂","🤣","😊","😍","🥰","😘","😉","😌","🤔","😎","🥳","😭","😡","😴","🤗","😜","😱","😅","😳","🙄","😤","😷","🤒","🤕","😇","🤐","😬","😑","😐","😶","🙃","😋","😛","😝","🤪","🥴","😵","🤯","🥺","😢","😥","😓","😞","😟","😕","🫤"]},
  {name:'手势',list:["🤝","👌","✌️","👍","👎","🙏","👏","💪","👋","🤙","🙌","👊","✊","🫶","🤞","🤟","☝️","👇","👆","👈","👉","🖐️","🤷","🙋","🧑","👶","💁","🙇","🫡","🧎","🤌","🤏","🫰","🫱","🫲","🫳","🫴","🫵","💅","👂","👃","👀","🦵","🦶"]},
  {name:'动物 · 自然',list:["🐶","🐱","🐼","🦊","🐷","🐸","🐵","🦁","🐯","🐰","🐻","🐨","🐹","🐔","🐧","🦄","🐲","🐝","🦋","🐺","🐗","🐴","🦓","🦒","🐘","🐪","🐄","🐑","🐐","🦌","🐦","🦆","🦅","🦉","🐤","🌸","🌹","🌻","🌷","🌵","🌲","🌴","🍀","🍁","🌈","⭐","🌙","☀️","⚡","🔥","❄️","💧","🌊"]},
  {name:'美食',list:["🍎","🍉","🍓","🍰","🎂","🍺","☕","🍔","🍕","🍜","🍚","🍦","🍬","🍭","🍩","🍗","🍿","🥤","🍇","🍌","🍊","🥭","🍑","🍍","🥥","🍫","🥟","🍣","🍤","🍱","🍞","🥐","🧀","🥚","🥓","🍟","🌭","🌮","🥗","🍝","🍲","🍛","🍵","🧃","🍹","🍷","🥂","🍒"]},
  {name:'物品 · 活动',list:["🎁","🎉","🎊","🎮","🎵","🚀","⚽","🏀","🏓","🎯","📱","💻","✏️","📷","💰","👑","💯","✅","❌","❤️","💔","❓","❗","🌍","🚗","✈️","🎸","🏆","🌟","🔔","🎈","🎆","🏈","⚾","🎾","🏐","🎱","🏸","🥊","⛳","🎿","🛹","🎻","🥁","🎺","🎤","🎧","📚","🚲","🛵","🕰"]}
];
var state={me:null,token:null,users:{},sessions:{},groups:{},allMsgs:[],ids:{},currentChat:null,lastSeenId:0,registerMode:false,authFailed:false,requests:[]};
var imgPromise={};
var actx=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(t){return new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}
function isGroupKey(k){return k&&k.indexOf('g:')===0;}
function isEmojiOnly(s){if(!s)return false;var count=0;for(var i=0;i<s.length;i++){var cp=s.codePointAt(i);if(cp>0xFFFF)i++;var em=(cp>=0x1F000&&cp<=0x1FAFF)||(cp>=0x2600&&cp<=0x27BF)||(cp>=0x2B00&&cp<=0x2BFF)||(cp>=0x1F1E6&&cp<=0x1F1FF)||cp===0xFE0F||cp===0x2764||cp===0x2705||cp===0x23F3;if(!em)return false;count++;if(count>6)return false;}return count>0;}
function seqEq(a,b){a=a||[];b=b||[];if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.15);o.start();o.stop(actx.currentTime+0.16);}catch(e){}}

function api(path,method,body,raw){
  method=method||'GET';
  var sep=path.indexOf('?')>=0?'&':'?';
  var url=path+sep+'token='+encodeURIComponent(state.token||'');
  var opt={method:method,headers:{}};
  if(body!==undefined&&!raw){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  if(raw)opt.body=body;
  var ctrl=('AbortController' in window)?new AbortController():null;
  if(ctrl)opt.signal=ctrl.signal;
  var to=setTimeout(function(){if(ctrl)ctrl.abort();},12000);
  return fetch(url,opt).then(function(res){
    clearTimeout(to);
    return res.json().catch(function(){return{};}).then(function(j){
      if(!res.ok){var e=new Error(j.error||('HTTP '+res.status));e.code=res.status;throw e;}
      return j;
    });
  },function(err){
    clearTimeout(to);
    if(err&&(err.name==='AbortError')){var e=new Error('连接超时');e.code=0;throw e;}
    throw err;
  });
}

/* ---------- 连接检测 ---------- */
function checkServer(){
  var el=$('#connStatus');
  fetch('/api/status?token=').then(function(res){return res.json();}).then(function(j){
    if(j&&j.app&&j.app.indexOf('极简')>=0){
      el.textContent='✅ 已连接到电脑服务端';
      el.className='conn ok';
    }else{
      el.textContent='⚠ 服务端异常';
      el.className='conn bad';
    }
  }).catch(function(){
    el.textContent='❌ 无法连接电脑服务端\n请确认: 1.电脑端程序已启动并登录 2.隧道窗口保持开启 3.手机网络能访问此网址';
    el.className='conn bad';
  });
}
setInterval(function(){ if(!state.me) checkServer(); }, 5000);

/* ---------- 登录 ---------- */
function doLogin(){
  var name=$('#nameInput').value.trim();
  var pass=$('#passInput').value;
  var err=$('#loginMsg');
  if(!name){err.textContent='请输入昵称';return;}
  if(pass.length<4){err.textContent='密码至少4位';return;}
  if(state.registerMode&&$('#passInput2').value!==pass){err.textContent='两次密码不一致';return;}
  $('#loginBtn').disabled=true;err.textContent='连接中...';
  var attempt = state.registerMode
    ? api('/api/register','POST',{name:name,password:pass})
        .catch(function(e){if(e.code===409)return api('/api/login','POST',{name:name,password:pass});throw e;})
    : api('/api/login','POST',{name:name,password:pass})
        .catch(function(e){if(e.code===404)return api('/api/register','POST',{name:name,password:pass});throw e;});
  attempt.then(function(r){
      state.token=r.token;state.me=r.user.name;
      $('#meName').textContent=state.me;
      $('#meAvatar').textContent=state.me[0];
      $('#meAvatar').style.background=r.user.color;
      $('#loginView').classList.add('hidden');
      $('#mainView').classList.remove('hidden');
      loadPrefs();
      loadKeepConvs();
      poll();pollFriends();
      loadCallConfig();startCallPolling();
      setInterval(poll,900);
      setInterval(pollFriends,4000);
      setInterval(function(){api('/api/ping','POST',{}).catch(function(){});},10000);
    })
    .catch(function(e){
      var m=e.message||'';
      if(m==='Failed to fetch'||m==='NetworkError'||m==='连接超时')m='无法连接服务器\n请检查: ① 电脑端程序是否已启动并登录 ② 隧道窗口是否保持开启 ③ 手机换个网络试试(移动数据/WiFi)';
      err.textContent='登录失败: '+m;
      checkServer();
    })
    .then(function(){if(!$('#loginBtn').disabled===false)$('#loginBtn').disabled=false;});
}

/* ---------- 轮询 ---------- */
var pollBusy=false;
function poll(){
  if(pollBusy)return Promise.resolve();
  pollBusy=true;
  return api('/api/messages?after='+state.lastSeenId).then(function(r){
    var ms=r.messages||[];
    if(ms.length){
      if(r.latestId)state.lastSeenId=r.latestId;
      var notify=false,vib=false;
      ms.forEach(function(m){
        // 去重: 网络慢时可能多次拉到同一条消息(全局ID集合)
        if(state.ids[m.id])return;
        state.ids[m.id]=true;
        // 跳过游戏联机协议消息(⛩NR:...), 它们只用于游戏信令, 不进入聊天界面
        if(m.type==='text'&&typeof m.text==='string'&&m.text.indexOf('⛩NR:')===0)return;
        state.allMsgs.push(m);
        var key;
        if(m.to&&m.to.indexOf('g:')===0)key=m.to;
        else if(m.type==='system')key='sys';
        else key=m.from===state.me?m.to:m.from;
        if(!state.sessions[key])state.sessions[key]={unread:0,last:null};
        state.sessions[key].last=m;
        if(m.from!==state.me&&m.type!=='system'){
          if(state.currentChat===key)markRead(key,m.id);
          else{
            state.sessions[key].unread++;
            if(!prefOf(key).mute){ notify=true; if(prefOf(key).alert)vib=true; }
          }
        }
      });
      if(notify)beep();
      if(vib&&navigator.vibrate){try{navigator.vibrate(180);}catch(e){}}
    }
    var chg=false;
    (r.updates||[]).forEach(function(u){
      var local=null;
      for(var i=0;i<state.allMsgs.length;i++){if(state.allMsgs[i].id===u.id){local=state.allMsgs[i];break;}}
      if(!local)return;
      if(!!u.recalled!==!!local.recalled){local.recalled=u.recalled;chg=true;}
      if(local.from===state.me&&!seqEq(local.deliveredTo,u.deliveredTo)){local.deliveredTo=u.deliveredTo;chg=true;}
      if(local.from===state.me&&!seqEq(local.readBy,u.readBy)){local.readBy=u.readBy;chg=true;}
    });
    if(chg||ms.length)render();
  }).catch(function(e){handleErr(e);})
  .then(function(){pollBusy=false;});
}
function pollFriends(){
  return Promise.all([api('/api/friends'),api('/api/groups')]).then(function(rs){
    var fr=rs[0],gr=rs[1];
    state.users={};
    (fr.friends||[]).forEach(function(u){
      if(u.name===state.me)return;
      state.users[u.name]=u;
    });
    state.requests=fr.requests||[];
    var gmap={};
    (gr.groups||[]).forEach(function(g){gmap[g.id]=g;});
    state.groups=gmap;
    var ns={};
    (fr.friends||[]).forEach(function(u){
      if(u.name===state.me)return;
      ns[u.name]=state.sessions[u.name]||{unread:0,last:null};
    });
    (gr.groups||[]).forEach(function(g){
      var key='g:'+g.id;
      ns[key]=state.sessions[key]||{unread:0,last:null};
    });
    ns['sys']=state.sessions['sys']||{unread:0,last:null};
    state.sessions=ns;
    render();
  }).catch(function(e){handleErr(e);});
}
function handleErr(e){

function msgPreview(m){

  if(m.type==='image')return '[图片]';

  if(m.type==='voice')return '[语音]'+(m.transcript?' '+m.transcript:'');

}
function renderSessions(){
  var box=$('#sessionList');
  var all=Object.keys(state.sessions).filter(function(k){return k!=='sys';});
  var folded=all.filter(function(k){return !!prefOf(k).fold;});
  var normal=all.filter(function(k){return !prefOf(k).fold;});
  var sorter=function(a,b){
    var pa=prefOf(a).pin?0:1,pb=prefOf(b).pin?0:1;
    if(pa!==pb)return pa-pb;
    var ga=isGroupKey(a)?0:1,gb=isGroupKey(b)?0:1;
    if(ga!==gb)return ga-gb;
    var ta=state.sessions[a].last?state.sessions[a].last.time:0;
    var tb=state.sessions[b].last?state.sessions[b].last.time:0;
    return tb-ta;
  };
  normal.sort(sorter);folded.sort(sorter);
  if(foldOpen)normal=normal.concat(folded).sort(sorter);
  var keys=['sys'].concat(normal);
  if(folded.length&&!foldOpen)keys.splice(1,0,'__fold__');
  var html='';
  keys.forEach(function(key){
    if(key==='__fold__'){
      html+='<div class="session" data-fold="1"><div class="foldico">📁</div><div class="info"><div class="name">折叠的聊天</div><div class="prev">'+folded.length+' 个聊天</div></div><div class="right"><div class="time">›</div></div></div>';
      return;
    }
    var st=state.sessions[key];
    var isGroup=isGroupKey(key);
    var isSys=key==='sys';
    var name=isSys?'系统通知':(isGroup?groupName(key):key);
    var online=isSys||isGroup||!!(state.users[key]&&state.users[key].online);
    var color=isSys?'#8d9b6a':(isGroup?'#07c160':(state.users[key]?state.users[key].color:'#5a8def'));
    var ch=isSys?'🔔':(isGroup?'群':(key[0]||'?'));
    var prev='暂无消息';
    if(st.last){
      var m=st.last;
      if(m.recalled)prev=(m.from===state.me?'你':m.from)+' 撤回了一条消息';
      else if(m.type==='system')prev=m.text;
      else if(isGroup)prev=(m.from===state.me?'我':m.from)+': '+msgPreview(m);
      else prev=(m.from===state.me?'我: ':'')+msgPreview(m);
    }
    html+='<div class="session" data-key="'+esc(key)+'">'
      +'<div class="avatar" style="background:'+color+'">'+esc(ch)+'</div>'
      +'<div class="info"><div class="name">'+esc(name)+' <span class="dot'+(online?'':' off')+'"></span></div>'
      +'<div class="prev">'+esc(prev)+'</div></div>'
      +'<div class="right"><div class="time">'+(prefOf(key).mute?'<span class="sess-mute">🔕</span>':'')+(st.last?fmtTime(st.last.time):'')+'</div>'
      +(st.unread>0?'<span class="badge">'+(st.unread>99?'99+':st.unread)+'</span>':'')
      +'</div></div>';
  });
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('.session'),function(el){
    el.addEventListener('click',function(){
      if(el.getAttribute('data-fold')){foldOpen=!foldOpen;renderSessions();return;}
      openChat(el.getAttribute('data-key'));

  });
}
function statusText(m){

function loadImg(fid){
  if(imgPromise[fid])return imgPromise[fid];
  imgPromise[fid]=fetch('/api/file?id='+encodeURIComponent(fid)+'&token='+encodeURIComponent(state.token||'')).then(function(res){
    if(!res.ok)throw new Error('load fail');
    return res.blob();
  }).then(function(blob){return URL.createObjectURL(blob);});
  return imgPromise[fid];
}
function openFile(fid){

}
function downloadFile(fid,name){
  fetch('/api/file?id='+encodeURIComponent(fid)+'&token='+encodeURIComponent(state.token||'')).then(function(res){
    if(!res.ok)throw new Error('fail');
    return res.blob();
  }).then(function(blob){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name||'file';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }).catch(function(){alert('下载失败');});

/* ---------- 会话切换 ---------- */
var stickBottom=true;
// 自定义滚动滑轮(手机浏览器会隐藏原生滚动条)
function updScrollRail(){
  var b=$('#msgList'), rail=$('#scrollRail'), th=$('#scrollThumb');
  if(!b||!rail||!th||!b.offsetParent)return;
  var r=b.getBoundingClientRect(), p=$('#chatView').getBoundingClientRect();
  rail.style.top=(r.top-p.top)+'px';
  rail.style.height=r.height+'px';
  var sh=b.scrollHeight, ch=b.clientHeight;
  if(sh<=ch+4){ rail.style.display='none'; return; }
  rail.style.display='block';
  var rh=rail.clientHeight, hh=Math.max(26,Math.round(rh*ch/sh));
  th.style.height=hh+'px';
  var maxTop=Math.max(0,rh-hh);
  th.style.top=Math.round(maxTop*((b.scrollTop)/Math.max(1,sh-ch)))+'px';
}
(function(){
  var box=$('#msgList'), btn=$('#toLatest'), rail=$('#scrollRail'), th=$('#scrollThumb');
  box.addEventListener('scroll',function(){
    stickBottom=(box.scrollHeight-box.scrollTop-box.clientHeight)<70;
    if(stickBottom)btn.classList.add('hidden');
    updScrollRail();
  },{passive:true});
  btn.addEventListener('click',function(){
    stickBottom=true;
    btn.classList.add('hidden');
    try{ box.scrollTo({top:box.scrollHeight,behavior:'smooth'}); }catch(e){ box.scrollTop=box.scrollHeight; }
    setTimeout(updScrollRail,300);
  });
  var drag=false;
  th.addEventListener('pointerdown',function(e){ drag=true; try{th.setPointerCapture(e.pointerId);}catch(x){} e.preventDefault(); });
  th.addEventListener('pointermove',function(e){
    if(!drag)return;
    var rr=rail.getBoundingClientRect();
    var rh=rail.clientHeight, hh=th.offsetHeight;
    var y=e.clientY-rr.top-hh/2;
    var frac=Math.max(0,Math.min(1,y/Math.max(1,rh-hh)));
    box.scrollTop=frac*(box.scrollHeight-box.clientHeight);
  });
  th.addEventListener('pointerup',function(){ drag=false; });
  th.addEventListener('pointercancel',function(){ drag=false; });
  window.addEventListener('resize',updScrollRail);
  updScrollRail();
})();

function sendText(){
  var text=$('#msgInput').value.trim();
  if(!text||!state.currentChat)return;
  if(state.currentChat==='sys'){alert('这里是系统通知，不能发送消息');return;}
  $('#msgInput').value='';
  api('/api/messages','POST',{to:state.currentChat,text:text}).then(function(){
    poll();
    if(!emojiOpen)$('#msgInput').focus();
  }).catch(function(e){
    alert('发送失败: '+e.message);
    if(!emojiOpen)$('#msgInput').focus();
  });
}
function uploadFile(file){
  if(!state.currentChat||state.currentChat==='sys'){alert('请先选择好友或群聊');return;}
  if(file.size>30*1024*1024){alert('文件不能超过30MB');return;}
  var url='/api/upload?token='+encodeURIComponent(state.token)
    +'&to='+encodeURIComponent(state.currentChat)
    +'&name='+encodeURIComponent(file.name||'file')
    +'&mime='+encodeURIComponent(file.type||'application/octet-stream');
  fetch(url,{method:'POST',body:file}).then(function(res){return res.json();}).then(function(j){
    if(!j.ok)throw new Error(j.error||'上传失败');
    poll();
  }).catch(function(e){alert('发送失败: '+e.message);});
}
function recall(id){
  api('/api/recall','POST',{id:id}).then(function(){poll();}).catch(function(e){alert('撤回失败: '+e.message);});
}

var emojiOpen=false, emojiTab=0, emojiSel={s:null,e:null};
var recentEmoji=[];
try{var _re=JSON.parse(localStorage.getItem('jj-recent-emoji')||'[]');if(_re&&_re.length)recentEmoji=_re.slice(0,16);}catch(e){}
var GRAPHEME_END_RE;
try{GRAPHEME_END_RE=/(?:\p{Extended_Pictographic}(?:\u200D\p{Extended_Pictographic})*[\uFE0F\u{1F3FB}-\u{1F3FF}\u{20E3}]*|[\u{1F1E6}-\u{1F1FF}]{2}|.)$/u;}
catch(e){GRAPHEME_END_RE=/[\uD800-\uDBFF][\uDC00-\uDFFF]|$/;}
function saveRecentEmoji(e){
  var i=recentEmoji.indexOf(e);
  if(i>=0)recentEmoji.splice(i,1);
  recentEmoji.unshift(e);
  if(recentEmoji.length>16)recentEmoji.length=16;
  try{localStorage.setItem('jj-recent-emoji',JSON.stringify(recentEmoji));}catch(err){}
}
function emojiCellHTML(e){return '<button type="button" data-emoji="'+e+'">'+e+'</button>';}
function renderEmojiPanel(){
  var box=$('#emojiScroll');
  if(!box)return;
  var html='';
  if(emojiTab===0&&recentEmoji.length){
    html+='<div class="emoji-sec">最近使用</div><div class="emoji-grid">'+recentEmoji.map(emojiCellHTML).join('')+'</div>';
  }
  var cat=EMOJI_CATS[emojiTab]||EMOJI_CATS[0];
  html+='<div class="emoji-sec">'+cat.name+'</div><div class="emoji-grid">'+cat.list.map(emojiCellHTML).join('')+'</div>';
  box.innerHTML=html;
  box.scrollTop=0;
  Array.prototype.forEach.call(document.querySelectorAll('#emojiBar .etab'),function(b){
    b.classList.toggle('on',+b.getAttribute('data-tab')===emojiTab);
  });
}
function emojiCursor(){
  var inp=$('#msgInput'), len=inp.value.length, s, t;
  if(emojiOpen&&emojiSel.s!=null){
    // 面板打开时输入框已失焦, 以打开面板/上次插入时记录的光标为准
    s=emojiSel.s; t=emojiSel.e==null?emojiSel.s:emojiSel.e;
  }else{
    s=inp.selectionStart; t=inp.selectionEnd;
    if(s==null||s<0)s=t=len;
  }
  s=Math.max(0,Math.min(s,len)); t=Math.max(0,Math.min(t,len));
  if(t<s)t=s;
  return {s:s,t:t};
}
function insertEmoji(e){
  var inp=$('#msgInput'), c=emojiCursor();
  inp.value=inp.value.slice(0,c.s)+e+inp.value.slice(c.t);
  var p=c.s+e.length;
  emojiSel.s=emojiSel.e=p;
  try{inp.setSelectionRange(p,p);}catch(err){}
  saveRecentEmoji(e);
  renderEmojiPanel();
  if(!emojiOpen){try{inp.focus();}catch(err){}}
}
function delEmojiChar(){
  var inp=$('#msgInput'), c=emojiCursor();
  if(c.s!==c.t){
    inp.value=inp.value.slice(0,c.s)+inp.value.slice(c.t);
  }else if(c.s>0){
    var m=inp.value.slice(0,c.s).match(GRAPHEME_END_RE);
    var cut=m?m[0].length:1;
    inp.value=inp.value.slice(0,c.s-cut)+inp.value.slice(c.s);
    c.s-=cut;
  }
  emojiSel.s=emojiSel.e=c.s;
  try{inp.setSelectionRange(c.s,c.s);}catch(err){}
}
function openEmojiPanel(){
  if(emojiOpen)return;
  emojiOpen=true;
  var inp=$('#msgInput'), c=emojiCursor();
  emojiSel.s=c.s;emojiSel.e=c.t;
  try{inp.blur();}catch(e){}
  $('#emojiPanel').classList.remove('hidden');
  document.body.classList.add('emoji-open');
  renderEmojiPanel();
  var b=$('#msgList');
  if(stickBottom){b.scrollTop=b.scrollHeight;}
  setTimeout(updScrollRail,60);
}
function closeEmojiPanel(focusInput){
  var inp=$('#msgInput');
  if(emojiOpen){
    emojiOpen=false;
    $('#emojiPanel').classList.add('hidden');
    document.body.classList.remove('emoji-open');
    setTimeout(updScrollRail,60);
    if(stickBottom){var b=$('#msgList');b.scrollTop=b.scrollHeight;}
  }
  if(focusInput){
    try{
      inp.focus();
      var p=emojiSel.s==null?inp.value.length:emojiSel.s;
      inp.setSelectionRange(p,p);
    }catch(e){}
  }
}
function initEmoji(){
  var box=$('#emojiScroll');
  box.addEventListener('click',function(ev){
    var n=ev.target;
    while(n&&n!==box&&!n.getAttribute('data-emoji'))n=n.parentNode;

}

/* ---------- 语音消息 ---------- */
var voiceMode=false, mr=null, recChunks=[], recStream=null, recStartT=0;
var recTimer=null, recMaxTimer=null, recPress=false, recCancel=false, recAbort=false, recStartY=0;
var srObj=null, srFinal='', srInterim='';
var vAudio=null, vEl=null, vCache={};
var CFG={ice:[{urls:'stun:stun.miwifi.com:3478'}],httpsPort:3778,tls:false};

function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:999;max-width:78%;text-align:center;line-height:1.5';
  document.body.appendChild(t);
  setTimeout(function(){try{t.remove();}catch(e){}},2200);
}
function secureOk(){
  if(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)return true;
  showHttpsHint();
  return false;
}
function showHttpsHint(){
  var defPort=CFG.httpsPort||3778;
  var base=location.hostname||'101.200.171.33';
  var url='https://'+base+':'+defPort+'/m';
  openModal('需要 HTTPS 安全连接');
  $('#modalBody').innerHTML='<div style="font-size:13px;line-height:1.75;padding:4px 2px">'
    +'浏览器只在 HTTPS 页面开放麦克风和摄像头，所以<b>语音消息 / 语音通话 / 视频通话</b>需要在下面的地址打开：'
    +'<div style="margin:10px 0"><a href="'+url+'" style="color:var(--green);word-break:break-all;font-weight:600">'+url+'</a></div>'
    +'<div style="color:var(--sub);font-size:12px">首次打开会提示证书不受信任，点「高级 → 继续前往」即可；登录状态按域名隔离，换过去重新登录一次就行。</div></div>';
  footBtn('复制地址','',function(){
    try{navigator.clipboard.writeText(url);toast('已复制地址');}catch(e){alert(url);}
  });
  footBtn('知道了','primary',closeModal);
}
function pickVoiceMime(){
  if(!window.MediaRecorder)return '';
  var list=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  if(!MediaRecorder.isTypeSupported)return '';
  for(var i=0;i<list.length;i++){ if(MediaRecorder.isTypeSupported(list[i]))return list[i]; }
  return '';
}
function stopStream(s){try{s.getTracks().forEach(function(t){t.stop();});}catch(e){}}
function setVoiceMode(on,focusInput){
  voiceMode=!!on;
  $('#voiceBtn').classList.toggle('on',voiceMode);
  $('#voiceIcoMic').classList.toggle('hidden',voiceMode);
  $('#voiceIcoKb').classList.toggle('hidden',!voiceMode);
  $('#msgInput').classList.toggle('hidden',voiceMode);
  $('#sendBtn').classList.toggle('hidden',voiceMode);
  $('#holdTalk').classList.toggle('hidden',!voiceMode);
  $('#holdTalk').textContent='按住 说话';
  if(voiceMode){ closeEmojiPanel(false); try{$('#msgInput').blur();}catch(e){} }
  else if(focusInput!==false){ try{$('#msgInput').focus();}catch(e){} }
}
function startSr(){
  srFinal='';srInterim='';
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    var r=new SR();
    r.lang='zh-CN';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
    r.onresult=function(ev){
      var f='',it='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var res=ev.results[i];
        if(res.isFinal)f+=res[0].transcript;else it+=res[0].transcript;
      }
      if(f)srFinal=(srFinal+' '+f).trim();
      srInterim=it||'';
    };
    r.onerror=function(){};
    r.onend=function(){ if(recPress){try{r.start();}catch(e){}} };
    r.start();
    srObj=r;
  }catch(e){srObj=null;}
}
function updateRecUI(){
  if(!recStartT)return;
  var s=Math.floor((Date.now()-recStartT)/1000);
  $('#recTime').textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}
function cleanupRec(){
  clearInterval(recTimer);clearTimeout(recMaxTimer);
  recTimer=null;recMaxTimer=null;recStartT=0;
  if(recStream){stopStream(recStream);recStream=null;}
  mr=null;recChunks=[];
}
function onRecStop(){
  var cancel=recAbort;
  var dur=(Date.now()-recStartT)/1000;
  var mime=(mr&&mr.mimeType)||'audio/webm';
  var blob=new Blob(recChunks,{type:mime});
  var size=blob.size;
  cleanupRec();
  setTimeout(function(){
    var text=(srFinal+' '+(srInterim||'')).replace(/\s+/g,' ').trim();
    try{if(srObj)srObj.stop();}catch(e){}
    srObj=null;srFinal='';srInterim='';
    if(cancel||size<400||dur<0.6){ toast('录音太短'); return; }
    sendVoice(blob,dur,text,mime);
  },320);
}
function holdStart(ev){
  if(recPress)return;
  if(!state.currentChat||state.currentChat==='sys')return;
  if(!secureOk())return;
  ev.preventDefault();
  recPress=true;recCancel=false;recAbort=false;recStartY=ev.clientY;
  $('#holdTalk').classList.add('rec');
  $('#recHint').classList.remove('hidden');
  $('#recTime').textContent='0:00';
  $('#recTip').textContent='上滑取消'+((window.SpeechRecognition||window.webkitSpeechRecognition)?' · 转文字中…':' · 本设备无法转文字');
  try{$('#holdTalk').setPointerCapture(ev.pointerId);}catch(e){}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    if(!recPress){stopStream(stream);return;}
    recStream=stream;
    var mime=pickVoiceMime();
    try{ mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
    catch(e){ mr=new MediaRecorder(stream); }
    recChunks=[];
    mr.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data);};
    mr.onstop=onRecStop;
    mr.start();
    recStartT=Date.now();
    startSr();
    recTimer=setInterval(updateRecUI,200);
    recMaxTimer=setTimeout(function(){ if(recPress)holdEnd(); },60000);
  }).catch(function(e){
    recPress=false;
    $('#holdTalk').classList.remove('rec');
    $('#recHint').classList.add('hidden');
    alert('无法打开麦克风: '+(e.name==='NotAllowedError'?'权限被拒绝，请在浏览器设置中允许麦克风':(e.message||e.name)));
  });
}
function holdMove(ev){
  if(!recPress)return;
  var cancel=(ev.clientY-recStartY)<-55;
  if(cancel===recCancel)return;
  recCancel=cancel;
  var b=$('#holdTalk');
  b.classList.toggle('cancel',cancel);
  b.textContent=cancel?'松开 取消':'松开 发送';
  $('#recTip').textContent=cancel?'松开手指 取消发送':'上滑取消';
}
function holdEnd(){
  if(!recPress)return;
  recPress=false;
  recAbort=recCancel;
  var b=$('#holdTalk');
  b.classList.remove('rec','cancel');
  b.textContent='按住 说话';
  $('#recHint').classList.add('hidden');
  clearInterval(recTimer);clearTimeout(recMaxTimer);
  try{if(srObj)srObj.stop();}catch(e){}
  if(mr&&mr.state!=='inactive'){
    try{mr.stop();}catch(e){cleanupRec();}
  }else{
    cleanupRec();
  }
}
function sendVoice(blob,dur,text,mime){
  var chat=state.currentChat;
  if(!chat||chat==='sys')return;
  var ext=mime.indexOf('mp4')>=0?'m4a':(mime.indexOf('ogg')>=0?'ogg':'webm');
  var url='/api/upload?token='+encodeURIComponent(state.token)
    +'&to='+encodeURIComponent(chat)
    +'&name='+encodeURIComponent('voice.'+ext)
    +'&mime='+encodeURIComponent(mime)
    +'&kind=voice&dur='+encodeURIComponent(dur.toFixed(1))
    +'&text='+encodeURIComponent(text||'');
  fetch(url,{method:'POST',body:blob}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok)throw new Error(j.error||'发送失败');
    poll();
  }).catch(function(e){ alert('语音发送失败: '+e.message); });
}
function setBarProgress(el,ratio){
  if(!el)return;
  var bs=el.querySelectorAll('.vbars i'), n=Math.round(bs.length*ratio);
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',i<n);
}
function vCurrentEl(fid){
  if(vEl&&document.body.contains(vEl))return vEl;
  vEl=document.querySelector('.voicebubble[data-vid="'+fid+'"]');
  return vEl;
}
function vRatio(el){
  var d=vAudio&&vAudio.duration;
  if(!d||!isFinite(d))d=Number(el.getAttribute('data-dur'))||1;
  return Math.min(1,(vAudio.currentTime||0)/d);
}
function rebindVoice(){
  if(!vAudio)return;
  var el=vCurrentEl(vAudio._fid);
  if(!el)return;
  el.querySelector('.vicon').textContent=vAudio.paused?'▶':'⏸';
  setBarProgress(el,vRatio(el));
}
function playVoice(el){
  var fid=el.getAttribute('data-vid');
  var icon=el.querySelector('.vicon');
  if(vAudio&&vAudio._fid===fid){
    if(vAudio.paused){ vAudio.play().catch(function(){}); icon.textContent='⏸'; }
    else { vAudio.pause(); icon.textContent='▶'; }
    vEl=el;
    return;
  }
  if(vAudio){ try{vAudio.pause();}catch(e){} if(vEl){vEl.querySelector('.vicon').textContent='▶';setBarProgress(vEl,0);} }
  var get=vCache[fid]?Promise.resolve(vCache[fid]):loadImg(fid).then(function(u){vCache[fid]=u;return u;});
  get.then(function(src){
    vAudio=new Audio(src);vAudio._fid=fid;vEl=el;
    icon.textContent='⏸';
    vAudio.ontimeupdate=function(){
      var e=vCurrentEl(fid);
      if(e)setBarProgress(e,vRatio(e));
    };
    vAudio.onended=function(){
      var e=vCurrentEl(fid);
      if(e){e.querySelector('.vicon').textContent='▶';setBarProgress(e,0);}
      vAudio=null;vEl=null;
    };
    vAudio.onpause=function(){ var e=vCurrentEl(fid); if(e)e.querySelector('.vicon').textContent='▶'; };
    vAudio.onplay=function(){ var e=vCurrentEl(fid); if(e)e.querySelector('.vicon').textContent='⏸'; };
    vAudio.play().catch(function(){ icon.textContent='▶'; alert('播放失败，可能是浏览器限制自动播放'); });
  }).catch(function(){ alert('语音加载失败'); });
}

/* ---------- 语音 / 视频通话 (WebRTC, 服务器只转发信令) ---------- */
var call={pc:null,stream:null,peer:'',callId:'',media:'audio',mine:false,connectedAt:0,timer:null,pending:[],active:false,timeout:null};
var incoming=null, ringTimer=null, ringStep=0, callPollBusy=false, callSeq=0, incTimer=null, callFirstPoll=true;

function loadCallConfig(){
  api('/api/call/config').then(function(j){ if(j&&j.ice)CFG=j; }).catch(function(){});
}
function startCallPolling(){
  if(startCallPolling._on)return;
  startCallPolling._on=true;
  var loop=function(){
    if(!state.me){startCallPolling._t=setTimeout(loop,2000);return;}
    pollCalls();
    startCallPolling._t=setTimeout(loop,(call.active||incoming)?700:1500);
  };
  loop();
}
function pollCalls(){
  if(callPollBusy||!state.me)return;
  callPollBusy=true;
  var since=callFirstPoll?999999999:callSeq;
  api('/api/call/inbox?since='+since).then(function(r){
    callPollBusy=false;
    if(r&&r.seq)callSeq=r.seq;
    var fresh=!callFirstPoll;
    callFirstPoll=false;
    if(fresh)(r.messages||[]).forEach(handleCallSignal);
  }).catch(function(){callPollBusy=false;});
}
function callSignal(to,type,extra,media,callId){
  var b={to:to,type:type,media:media||call.media||'audio',callId:callId||call.callId};
  if(extra&&extra.sdp)b.sdp=extra.sdp;
  if(extra&&extra.cand)b.cand=extra.cand;
  return api('/api/call/signal','POST',b).catch(function(){});
}
function ring(kind){
  stopRing();
  ringStep=0;
  var tick=function(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
    try{if(actx.state==='suspended')actx.resume();}catch(e){}
    try{
      var o=actx.createOscillator(),g=actx.createGain();
      o.connect(g);g.connect(actx.destination);o.type='sine';
      o.frequency.value=kind==='incoming'?(ringStep%2?660:880):440;
      var t=actx.currentTime;
      g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(0.09,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.start(t);o.stop(t+0.52);
    }catch(e){}
    ringStep++;
  };
  tick();
  ringTimer=setInterval(tick,kind==='incoming'?1800:1400);
}
function stopRing(){ if(ringTimer){clearInterval(ringTimer);ringTimer=null;} }

function makePC(){
  var pc=new RTCPeerConnection({iceServers:CFG.ice||[]});
  call.pc=pc;
  pc.onicecandidate=function(ev){ if(ev.candidate)callSignal(call.peer,'ice',{cand:ev.candidate}); };
  pc.ontrack=function(ev){
    var rv=$('#remoteVideo');
    if(ev.streams&&ev.streams[0])rv.srcObject=ev.streams[0];
    else if(!rv.srcObject){ rv.srcObject=new MediaStream([ev.track]); }
    else rv.srcObject.addTrack(ev.track);
    rv.play().catch(function(){});
  };
  pc.onconnectionstatechange=function(){
    var st=pc.connectionState;
    if(st==='connected'){
      stopRing();
      clearTimeout(call.timeout);
      if(!call.connectedAt)call.connectedAt=Date.now();
      $('#callState').textContent='通话中';
      startCallTimer();
      flushCands();
    }else if(st==='failed'){
      endCall('连接失败：双方网络可能被运营商 NAT 拦截，需要 TURN 中转',true);
    }
  };
  return pc;
}
function addCand(c){
  if(!call.pc||!call.pc.remoteDescription){ call.pending.push(c); return; }
  try{call.pc.addIceCandidate(new RTCIceCandidate(c)).catch(function(){});}catch(e){}
}
function flushCands(){ var q=call.pending.slice(); call.pending=[]; q.forEach(addCand); }
function startCallTimer(){
  clearInterval(call.timer);
  call.timer=setInterval(function(){
    if(!call.connectedAt)return;
    var s=Math.floor((Date.now()-call.connectedAt)/1000);
    $('#callState').textContent='通话中 '+Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
  },500);
}
function showLocal(stream,media){
  var lv=$('#localVideo');
  lv.srcObject=stream||null;
  lv.classList.toggle('hidden',media!=='video');
}
function showCallUI(mode){
  var cv=$('#callView');
  cv.classList.remove('hidden');
  cv.classList.toggle('audio',call.media!=='video');
  cv.classList.toggle('video',call.media==='video');
  showLocal(call.stream,call.media);
  var u=state.users[call.peer];
  $('#callAvatar').style.background=(u&&u.color)||'#5a8def';
  $('#callAvatar').textContent=(call.peer||'?').charAt(0);
  $('#callName').textContent=call.peer||'';
  $('#btnCam').classList.toggle('hidden',call.media!=='video');
  $('#btnMute').classList.remove('on');
  $('#btnCam').classList.remove('on');
  $('#callState').textContent=mode==='outgoing'?'正在呼叫…':(mode==='connecting'?'正在连接…':'通话中');
}
function hideCallUI(){ $('#callView').classList.add('hidden'); try{$('#remoteVideo').srcObject=null;}catch(e){} try{$('#localVideo').srcObject=null;}catch(e){} }
function startCall(media){
  var peer=state.currentChat;
  if(!peer||peer==='sys'||isGroupKey(peer)){ alert('只能和好友一对一通话'); return; }
  if(!window.RTCPeerConnection){ alert('当前浏览器不支持通话'); return; }
  if(!secureOk())return;
  if(call.active){ toast('正在通话中'); return; }
  if(state.users[peer]&&state.users[peer].online===false){
    if(!confirm(peer+' 当前显示离线，仍要呼叫吗？'))return;
  }
  call.active=true;call.mine=true;call.peer=peer;call.media=media;
  call.callId=Math.random().toString(36).slice(2)+Date.now().toString(36);
  call.pending=[];call.connectedAt=0;call.stream=null;
  showCallUI('outgoing');
  var constraints=media==='video'?{audio:true,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}}:{audio:true};
  navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    if(!call.active){stopStream(stream);return;}
    call.stream=stream;
    showLocal(stream,media);
    var pc=makePC();
    stream.getTracks().forEach(function(t){pc.addTrack(t,stream);});
    return pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){
      callSignal(peer,'invite',{sdp:pc.localDescription});
      ring('outgoing');
      clearTimeout(call.timeout);
      call.timeout=setTimeout(function(){ if(call.active&&!call.connectedAt)endCall('对方无应答',true); },45000);
    });
  }).catch(function(e){
    endCall('无法开始通话: '+(e.name==='NotAllowedError'?'麦克风/摄像头权限被拒绝':(e.message||e.name)),true);
  });
}
function acceptCall(){
  if(!incoming)return;
  if(!secureOk())return;
  var inc=incoming;
  incoming=null;
  clearTimeout(incTimer);
  stopRing();
  $('#incomingView').classList.add('hidden');
  call.active=true;call.mine=false;call.peer=inc.from;call.callId=inc.callId;call.media=inc.media;
  call.pending=[];call.connectedAt=0;call.stream=null;
  showCallUI('connecting');
  var constraints=inc.media==='video'?{audio:true,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}}}:{audio:true};
  navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    call.stream=stream;
    showLocal(stream,inc.media);
    var pc=makePC();
    stream.getTracks().forEach(function(t){pc.addTrack(t,stream);});
    return pc.setRemoteDescription(new RTCSessionDescription(inc.sdp));
  }).then(function(){
    flushCands();
    return call.pc.createAnswer();
  }).then(function(a){
    return call.pc.setLocalDescription(a);
  }).then(function(){
    callSignal(call.peer,'answer',{sdp:call.pc.localDescription});
  }).catch(function(e){
    endCall('接听失败: '+(e.message||e.name),true);
  });
}
function rejectCall(){
  if(!incoming)return;
  var inc=incoming;incoming=null;
  clearTimeout(incTimer);
  stopRing();
  $('#incomingView').classList.add('hidden');
  api('/api/call/signal','POST',{to:inc.from,type:'reject',callId:inc.callId,media:inc.media}).catch(function(){});
}
function endCall(msg,notify){
  if(notify&&call.peer&&call.callId)callSignal(call.peer,'hangup');
  stopRing();
  clearTimeout(call.timeout);
  try{if(call.stream)stopStream(call.stream);}catch(e){}
  try{if(call.pc)call.pc.close();}catch(e){}
  clearInterval(call.timer);
  call={pc:null,stream:null,peer:'',callId:'',media:'audio',mine:false,connectedAt:0,timer:null,pending:[],active:false,timeout:null};
  hideCallUI();
  if(msg)toast(msg);
}
function handleCallSignal(m){
  if(!m||!m.type)return;
  if(m.type==='invite'){
    if(call.active||incoming){
      api('/api/call/signal','POST',{to:m.from,type:'busy',callId:m.callId,media:m.media}).catch(function(){});
      return;
    }
    incoming={from:m.from,callId:m.callId,media:m.media,sdp:m.sdp};
    var u=state.users[m.from];
    $('#incAvatar').style.background=(u&&u.color)||'#5a8def';
    $('#incAvatar').textContent=(m.from||'?').charAt(0);
    $('#incName').textContent=m.from;
    $('#incType').textContent=m.media==='video'?'邀请你视频通话':'邀请你语音通话';
    $('#incomingView').classList.remove('hidden');
    ring('incoming');
    clearTimeout(incTimer);
    incTimer=setTimeout(function(){ rejectCall(); },45000);
    return;
  }
  if((m.type==='hangup'||m.type==='cancel')&&incoming&&(!m.callId||m.callId===incoming.callId)){
    incoming=null;
    clearTimeout(incTimer);
    stopRing();
    $('#incomingView').classList.add('hidden');
    return;
  }
  if(!call.active)return;
  if(m.callId&&call.callId&&m.callId!==call.callId)return;
  if(m.from&&call.peer&&m.from!==call.peer)return;
  if(m.type==='answer'){
    if(call.pc&&!call.pc.currentRemoteDescription&&m.sdp){
      call.pc.setRemoteDescription(new RTCSessionDescription(m.sdp)).then(flushCands).catch(function(){});
    }
  }else if(m.type==='ice'){
    if(m.cand)addCand(m.cand);
  }else if(m.type==='hangup'||m.type==='reject'||m.type==='busy'||m.type==='cancel'){
    var why=m.type==='busy'?'对方正在通话中':(m.type==='reject'?'对方已拒绝':'通话已结束');
    endCall(why,false);
  }
}

var prefs={}, foldOpen=false;
var BGS=[
  {n:'默认',v:''},
  {n:'米黄',v:'linear-gradient(180deg,#fdf7ea,#f4e9d3)'},
  {n:'薄荷',v:'linear-gradient(180deg,#eaf7ef,#d9ecdf)'},
  {n:'天蓝',v:'linear-gradient(180deg,#eaf1fb,#d8e5f6)'},
  {n:'樱粉',v:'linear-gradient(180deg,#fdeef2,#f7dde5)'},
  {n:'夜色',v:'linear-gradient(180deg,#20242b,#14171c)'}
];
function loadPrefs(){

  if(typeof prefs!=='object'||prefs===null)prefs={};

function savePrefs(){ try{localStorage.setItem('jj-chat-prefs:'+(state.me||''),JSON.stringify(prefs));}catch(e){} }
function keepConv(k){

    if(a.indexOf(k)<0){a.push(k);localStorage.setItem('jj-keep:'+(state.me||''),JSON.stringify(a));}

function loadKeepConvs(){
  try{
    var a=JSON.parse(localStorage.getItem('jj-keep:'+(state.me||''))||'[]');
    a.forEach(function(k){ if(!state.sessions[k])state.sessions[k]={last:null,unread:0}; });
  }catch(e){}
}
function prefOf(k){ if(!k)return {}; if(!prefs[k])prefs[k]={}; return prefs[k]; }
function chatNameOf(k){
  if(isGroupKey(k))return groupName(k)||'群聊';
  return k||'';
}
function convKeyOfMsg(m){
  if(m.to&&isGroupKey(m.to))return m.to;
  return m.from===state.me?m.to:m.from;
}
function applyChatBg(){
  var el=$('#msgList'), v=(state.currentChat&&prefOf(state.currentChat).bg)||'';
  el.style.background=v||'';
  el.style.backgroundSize='cover';
  el.style.backgroundPosition='center';
}
function renderInfoMembers(){
  var k=state.currentChat, box=$('#infoMembers'), html='';
  if(isGroupKey(k)){
    var g=(state.groups&&state.groups[k.substring(2)])||{members:[]};
    (g.members||[]).forEach(function(n){
      var u=state.users[n]||{};
      html+='<div class="mchip"><div class="mav" style="background:'+(u.color||'#8a8f99')+'">'+esc((n||'?').charAt(0))+'</div><div class="mnm">'+esc(n)+'</div></div>';

    var u=state.users[k]||{};
    html+='<div class="mchip"><div class="mav" style="background:'+(u.color||'#8a8def')+'">'+esc((k||'?').charAt(0))+'</div><div class="mnm">'+esc(k)+'</div></div>';

function closeChatInfo(){ $('#chatInfo').classList.add('hidden'); }
function openChatSearch(){
  $('#searchInput').value='';
  $('#searchResults').innerHTML='<div id="searchEmpty">输入关键词搜索当前聊天记录</div>';
  $('#chatSearch').classList.remove('hidden');
  setTimeout(function(){try{$('#searchInput').focus();}catch(e){}},80);
}
function closeChatSearch(){ $('#chatSearch').classList.add('hidden'); }
function msgSearchText(m){
  if(m.type==='text')return m.text||'';
  if(m.type==='voice')return m.transcript||'';
  if(m.type==='file')return m.fileName||'';
  if(m.type==='image')return '[图片]';
  return '';
}
function runSearch(){
  var q=($('#searchInput').value||'').trim().toLowerCase();
  var box=$('#searchResults');
  var k=state.currentChat;
  if(!q){ box.innerHTML='<div id="searchEmpty">输入关键词搜索当前聊天记录</div>'; return; }
  var list=(state.allMsgs||[]).filter(function(m){
    return convKeyOfMsg(m)===k&&m.type!=='system'&&msgSearchText(m).toLowerCase().indexOf(q)>=0;
  }).slice(-100).reverse();
  if(!list.length){ box.innerHTML='<div id="searchEmpty">没有找到「'+esc(q)+'」相关的聊天记录</div>'; return; }
  box.innerHTML=list.map(function(m){
    var u=state.users[m.from]||{};
    var t=msgSearchText(m);
    var idx=t.toLowerCase().indexOf(q);
    var before=esc(t.slice(0,idx)), hit=esc(t.slice(idx,idx+q.length)), after=esc(t.slice(idx+q.length));
    return '<div class="sres" data-id="'+m.id+'"><div class="sav" style="background:'+(u.color||'#8a8def')+'">'+esc((m.from||'?').charAt(0))+'</div>'
      +'<div><div class="st">'+esc(m.from)+' · '+fmtTime(m.time)+'</div><div class="sx">'+before+'<em>'+hit+'</em>'+after+'</div></div></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.sres'),function(el){
    el.addEventListener('click',function(){ jumpToMsg(Number(el.getAttribute('data-id'))); });
  });
}
function jumpToMsg(id){
  var m=(state.allMsgs||[]).filter(function(x){return x.id===id;})[0];
  if(!m)return;
  var k=convKeyOfMsg(m);
  closeChatSearch();
  closeChatInfo();
  if(state.currentChat!==k)openChat(k);
  setTimeout(function(){
    var el=document.querySelector('#msgList [data-id="'+id+'"]');
    if(!el){ toast('这条记录还没加载出来'); return; }
    el.scrollIntoView({block:'center'});
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  },320);
}
function openBgPicker(){
  var k=state.currentChat, cur=prefOf(k).bg||'';
  openModal('聊天背景');
  $('#modalBody').innerHTML='<div id="bgPicker">'+BGS.map(function(b,i){
    return '<button type="button" data-bg="'+i+'" class="'+(b.v===cur?'on':'')+' lbl" style="background:'+(b.v||'var(--inputbg)')+'">'+b.n+'</button>';
  }).join('')+'</div>';
  Array.prototype.forEach.call($('#bgPicker').querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){
      var bg=BGS[Number(b.getAttribute('data-bg'))].v;
      prefOf(k).bg=bg||'';
      if(!bg)delete prefOf(k).bg;
      savePrefs();
      applyChatBg();
      closeModal();
      toast('背景已更新');
    });
  });
  footBtn('取消','',closeModal);
}
function clearChatHistory(){
  var k=state.currentChat;
  if(!k)return;
  if(!confirm('确定清空与「'+chatNameOf(k)+'」的聊天记录？\n（只清空你这一侧，对方仍保留）'))return;
  api('/api/messages/clear','POST',{to:k}).then(function(){
    state.allMsgs=(state.allMsgs||[]).filter(function(m){return convKeyOfMsg(m)!==k;});
    if(state.sessions[k]){state.sessions[k].last=null;state.sessions[k].unread=0;}
    else state.sessions[k]={last:null,unread:0};
    keepConv(k);
    applyChatBg();
    render();
    closeChatInfo();
    toast('聊天记录已清空');
  }).catch(function(e){ alert('清空失败: '+e.message); });
}
function openReport(){

    +'<div style="font-size:12px;color:var(--sub);margin-top:8px">提交后记录会保存在服务器，管理员可查看。</div></div>';

      closeModal(); toast('已提交');

function bindChatInfoUI(){
  $('#chatInfoBtn').addEventListener('click',openChatInfo);
  $('#infoBack').addEventListener('click',closeChatInfo);
  $('#infoBell').addEventListener('click',function(){
    var p=prefOf(state.currentChat);
    p.mute=!p.mute; savePrefs();

    $('#infoBell').classList.toggle('muted',!!p.mute);
    renderSessions();
  });
  $('#optMute').addEventListener('change',function(){
    prefOf(state.currentChat).mute=this.checked;

    $('#infoBell').classList.toggle('muted',this.checked);
    savePrefs();renderSessions();
  });
  $('#optFold').addEventListener('change',function(){
    prefOf(state.currentChat).fold=this.checked||undefined;
    if(!this.checked)delete prefOf(state.currentChat).fold;
    savePrefs();renderSessions();
  });
  $('#optPin').addEventListener('change',function(){
    prefOf(state.currentChat).pin=this.checked||undefined;
    if(!this.checked)delete prefOf(state.currentChat).pin;

  $('#rowSearch').addEventListener('click',openChatSearch);

function refreshFriendsModal(){
  modalLoading();
  Promise.all([api('/api/friends'),api('/api/users')]).then(function(rs){

    var friendSet={},reqSet={};

    (fr.requests||[]).forEach(function(x){reqSet[x.name]=true;});

    var all=(us.users||[]).filter(function(x){return x.name!==state.me;});
    var body=$('#modalBody');

        +'<button data-accept="'+esc(x.name)+'">接受</button>'

        +'</div>';
    });
    html+='<div class="msec">添加好友</div>';
    all.filter(function(x){return !friendSet[x.name]&&!reqSet[x.name];}).forEach(function(x){
      html+='<div class="mrow"><div class="avatar small" style="background:'+x.color+'">'+esc(x.name[0]||'?')+'</div>'
        +'<div class="minfo"><div class="mname">'+esc(x.name)+(x.online?' <span class="dot"></span>':' <span class="dot off"></span>')+'</div></div>'
        +'<button data-add="'+esc(x.name)+'">添加</button>'
        +'</div>';
    });
    html+='<div class="msec">我的好友 ('+Object.keys(friendSet).length+')</div>';
    all.filter(function(x){return friendSet[x.name];}).forEach(function(x){
      html+='<div class="mrow"><div class="avatar small" style="background:'+x.color+'">'+esc(x.name[0]||'?')+'</div>'
        +'<div class="minfo"><div class="mname">'+esc(x.name)+(x.online?' <span class="dot"></span>':' <span class="dot off"></span>')+'</div></div>'
        +'<button data-del="'+esc(x.name)+'" class="danger">删除</button>'
        +'</div>';
    });
    body.innerHTML=html;
    Array.prototype.forEach.call(body.querySelectorAll('[data-accept]'),function(b){
      b.addEventListener('click',function(){
        api('/api/friends/accept','POST',{name:b.getAttribute('data-accept')}).then(function(){refreshFriendsModal();pollFriends();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-reject]'),function(b){
      b.addEventListener('click',function(){
        api('/api/friends/reject','POST',{name:b.getAttribute('data-reject')}).then(function(){refreshFriendsModal();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-add]'),function(b){
      b.addEventListener('click',function(){
        api('/api/friends/add','POST',{name:b.getAttribute('data-add')}).then(function(){refreshFriendsModal();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-del]'),function(b){
      b.addEventListener('click',function(){
        if(!confirm('确定删除好友 '+b.getAttribute('data-del')+' ？'))return;
        api('/api/friends/remove','POST',{name:b.getAttribute('data-del')}).then(function(){refreshFriendsModal();pollFriends();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    });
  }).catch(function(e){
    $('#modalBody').innerHTML='<div style="padding:14px;color:var(--sub)">加载失败: '+esc(e.message||'')+'</div>';
  });
}

function openGroupMembersModal(gid){
  openModal('群成员管理');
  refreshGroupMembersModal(gid);

function refreshGroupMembersModal(gid){
  modalLoading();
  Promise.all([api('/api/groups'),api('/api/friends')]).then(function(rs){
    var gr=rs[0],fr=rs[1];
    var g=null;
    (gr.groups||[]).forEach(function(x){if(x.id===gid)g=x;});
    var body=$('#modalBody');
    $('#modalFoot').innerHTML='';
    if(!g){
      body.innerHTML='<div style="padding:14px;color:var(--sub)">群聊不存在或你已不在群中</div>';
      footBtn('关闭','',closeModal);
      return;
    }
    var iAmAdmin=g.admin===state.me;
    var html='<div class="msec">群「'+esc(g.name)+'」 · '+g.members.length+' 人 · 群主 '+esc(g.admin)+'</div>';
    g.members.forEach(function(x){
      html+='<div class="mrow"><div class="avatar small" style="background:'+x.color+'">'+esc(x.name[0]||'?')+'</div>'
        +'<div class="minfo"><div class="mname">'+esc(x.name)+(x.name===g.admin?' 👑':'')+(x.online?' <span class="dot"></span>':' <span class="dot off"></span>')+'</div></div>'
        +(iAmAdmin&&x.name!==g.admin?'<button data-kick="'+esc(x.name)+'" class="danger">踢出</button>':'')
        +'</div>';
    });
    body.innerHTML=html;
    Array.prototype.forEach.call(body.querySelectorAll('[data-kick]'),function(b){
      b.addEventListener('click',function(){
        api('/api/groups/kick','POST',{id:gid,name:b.getAttribute('data-kick')}).then(function(){refreshGroupMembersModal(gid);pollFriends();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    });
    footBtn('刷新','',function(){refreshGroupMembersModal(gid);});
    if(iAmAdmin){
      footBtn('拉好友入群','',function(){showAddMemberSection(g);});
      footBtn('解散群','danger',function(){
        if(!confirm('确定解散群「'+g.name+'」？'))return;
        api('/api/groups/dismiss','POST',{id:gid}).then(function(){closeModal();pollFriends();}).catch(function(e){alert('操作失败: '+e.message);});
      });
    }else{
      footBtn('退群','danger',function(){
        api('/api/groups/leave','POST',{id:gid}).then(function(){closeModal();pollFriends();}).catch(function(e){alert('退群失败: '+e.message);});
      });
    }
    footBtn('关闭','',closeModal);
  }).catch(function(e){
    $('#modalBody').innerHTML='<div style="padding:14px;color:var(--sub)">加载失败: '+esc(e.message||'')+'</div>';
    footBtn('关闭','',closeModal);
  });
}
function showAddMemberSection(g){
